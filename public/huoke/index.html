<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}img{max-width:100%}[hidden]{display:none!important}</style>
<title>获客全链路</title>
<style>
/* 从上往下的一条链：先判断 → 认命 → 锁客 → 圈客 → 成客 → 生客 → 复盘，概念从每一步往右发散；颜色按步骤分（锁客 / 圈客 / 成客 / 生客），页面不标出处和日期；点开节点在侧边（手机在底部）读全文 */
:root {
  --bg: #edf1f0; --surface: #ffffff; --sunk: #e3e9e7; --ink: #17201e; --muted: #57635f;
  --line: #ccd6d3; --edge: #a9b8b4; --focus: #1d5e69;
  --jw: #1d5e69; --jw-bg: #e0eeef; --jw-ln: #b7d4d7;
  --mk: #985310; --mk-bg: #f7e9d6; --mk-ln: #e6c79f;
  --ln: #564b8b; --ln-bg: #ebe8f6; --ln-ln: #cdc6e8;
  --ai: #4c5a60; --ai-bg: #e6ebed; --ai-ln: #c5d0d4;
  --cf: #ab3225; --cf-bg: #f8e2de; --cf-ln: #ecb8af;
  --font-display: "Songti SC", "STSong", "Noto Serif CJK SC", "Source Han Serif SC", "SimSun", serif;
  --font-body: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
  --font-num: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0e1413; --surface: #161e1d; --sunk: #1d2826; --ink: #e2eae8; --muted: #94a39f;
  --line: #2a3634; --edge: #41524e; --focus: #71bcc7;
  --jw: #74bfca; --jw-bg: #15303a; --jw-ln: #24505b;
  --mk: #e7a764; --mk-bg: #382815; --mk-ln: #634722;
  --ln: #aaa0e6; --ln-bg: #25213c; --ln-ln: #403866;
  --ai: #a8b6bb; --ai-bg: #212b2f; --ai-ln: #36454b;
  --cf: #ef8173; --cf-bg: #3c1d19; --cf-ln: #6a332c;
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0e1413; --surface: #161e1d; --sunk: #1d2826; --ink: #e2eae8; --muted: #94a39f;
  --line: #2a3634; --edge: #41524e; --focus: #71bcc7;
  --jw: #74bfca; --jw-bg: #15303a; --jw-ln: #24505b;
  --mk: #e7a764; --mk-bg: #382815; --mk-ln: #634722;
  --ln: #aaa0e6; --ln-bg: #25213c; --ln-ln: #403866;
  --ai: #a8b6bb; --ai-bg: #212b2f; --ai-ln: #36454b;
  --cf: #ef8173; --cf-bg: #3c1d19; --cf-ln: #6a332c;
  color-scheme: dark; }

html { height: 100%; box-sizing: border-box; }
*, *::before, *::after { box-sizing: inherit; }
body { height: 100%; margin: 0; display: flex; flex-direction: column; overflow: hidden;
  background: var(--bg); color: var(--ink); font: 14px/1.6 var(--font-body); }
button { font: inherit; color: inherit; }
button:focus-visible, input:focus-visible, summary:focus-visible, .node:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

/* 顶栏 */
.bar { flex: none; display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 8px 14px;
  padding: 10px 16px; background: var(--surface); border-bottom: 1px solid var(--line); position: relative; z-index: 5; }
.brand { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
.brand h1 { margin: 0; font: 600 20px/1.2 var(--font-display); letter-spacing: .02em; white-space: nowrap; }
.brand small { color: var(--muted); font-size: 12px; white-space: nowrap; }
.search { position: relative; min-width: 0; }
.search input { width: 100%; max-width: 360px; height: 34px; padding: 0 12px; border: 1px solid var(--line); border-radius: 8px;
  background: var(--bg); color: var(--ink); font: inherit; }
.search input::placeholder { color: var(--muted); }
.results { position: absolute; left: 0; top: 40px; width: min(440px, calc(100vw - 32px)); max-height: 60vh; overflow-y: auto;
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 10px 30px rgba(0,0,0,.14); padding: 6px; z-index: 20; }
.results button { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 8px 10px; border-radius: 7px; cursor: pointer; }
.results button:hover, .results button:focus-visible { background: var(--sunk); }
.results b { display: block; font-weight: 600; }
.results span { display: block; color: var(--muted); font-size: 12.5px; line-height: 1.45; }
.results .none { padding: 10px; color: var(--muted); }
.views { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.views button { border: 0; background: none; padding: 6px 12px; cursor: pointer; }
.views button[aria-pressed="true"] { background: var(--ink); color: var(--surface); }

.chip { display: inline-flex; align-items: center; gap: 4px; flex: none; padding: 2px 8px; border-radius: 999px; font-size: 12px; line-height: 1.6;
  border: 1px solid transparent; white-space: nowrap; }
.chip i { font: 11px/1 var(--font-num); font-style: normal; opacity: .8; font-variant-numeric: tabular-nums; }
.c-jw { color: var(--jw); background: var(--jw-bg); border-color: var(--jw-ln); }
.c-mk { color: var(--mk); background: var(--mk-bg); border-color: var(--mk-ln); }
.c-ln { color: var(--ln); background: var(--ln-bg); border-color: var(--ln-ln); }
.c-ai { color: var(--ai); background: var(--ai-bg); border-color: var(--ai-ln); }
.c-cf { color: var(--cf); background: var(--cf-bg); border-color: var(--cf-ln); }
.c-type { color: var(--muted); background: transparent; border-color: var(--line); }
button.chip { cursor: pointer; }

/* 导图 */
.stage { flex: 1; position: relative; min-height: 0; }
#map { position: absolute; inset: 0; overflow: hidden; touch-action: none; cursor: grab;
  background-image: radial-gradient(var(--line) 1px, transparent 1px); background-size: 22px 22px; }
#map.dragging { cursor: grabbing; }
#world { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
#edges { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; }
#edges { color: var(--muted); }
#edges path { fill: none; stroke: var(--edge); stroke-width: 1.4; vector-effect: non-scaling-stroke; }
#edges path.sp { stroke: var(--muted); stroke-width: 1.8; }
#edges path.lp { stroke: var(--muted); stroke-width: 1.4; stroke-dasharray: 5 5; }
#edges marker path { fill: currentColor; stroke: none; }
.bridge { position: absolute; max-width: 196px; width: max-content; font-size: 12.5px; line-height: 1.45; color: var(--muted); pointer-events: none; }
.bridge.back { max-width: none; writing-mode: vertical-rl; letter-spacing: .12em; }
.node.spine:not(.t-step):not(.root) .nt { font: 600 16px/1.35 var(--font-display); }
.node { position: absolute; display: block; width: max-content; max-width: 210px; padding: 6px 10px 7px;
  border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink);
  font-size: 13.5px; line-height: 1.42; cursor: pointer; user-select: none; -webkit-user-select: none; overflow-wrap: anywhere; }
.node .nt { display: block; }
.node .ns { display: block; font-size: 11.5px; color: var(--muted); margin-top: 2px; }
.node .cnt { display: inline-block; margin-top: 4px; padding: 0 6px; border-radius: 999px; font: 11px/1.6 var(--font-num);
  background: var(--sunk); color: var(--muted); font-variant-numeric: tabular-nums; }
.node.p-jw { background: var(--jw-bg); border-color: var(--jw-ln); } .node.p-jw .tg { color: var(--jw); }
.node.p-mk { background: var(--mk-bg); border-color: var(--mk-ln); } .node.p-mk .tg { color: var(--mk); }
.node.p-ln { background: var(--ln-bg); border-color: var(--ln-ln); } .node.p-ln .tg { color: var(--ln); }
.node.p-ai { background: var(--ai-bg); border-color: var(--ai-ln); } .node.p-ai .tg { color: var(--ai); }
.node.p-cf { background: var(--cf-bg); border-color: var(--cf-ln); } .node.p-cf .tg { color: var(--cf); }
.node.t-step { max-width: 230px; padding: 9px 14px 10px; border-width: 1.5px; }
.node.t-step .nt { font: 600 18px/1.3 var(--font-display); }
.node.lv1:not(.t-step) .nt { font-weight: 600; font-size: 14.5px; }
.node.root { max-width: 250px; padding: 12px 16px; background: var(--ink); border-color: var(--ink); color: var(--surface); }
.node.root .nt { font: 600 22px/1.25 var(--font-display); letter-spacing: .03em; }
.node.root .ns { color: var(--surface); opacity: .75; }
.node.root .cnt { background: rgba(127,127,127,.25); color: var(--surface); }
.node.sel { box-shadow: 0 0 0 2px var(--focus); }
.ctl { position: absolute; left: 12px; top: 12px; display: flex; gap: 6px; z-index: 3; flex-wrap: wrap; max-width: calc(100% - 24px); }
.ctl button { height: 30px; padding: 0 10px; border: 1px solid var(--line); border-radius: 7px; background: var(--surface); cursor: pointer; font-size: 13px; }
.ctl button.sq { width: 30px; padding: 0; font: 16px/1 var(--font-num); }
.hint { position: absolute; left: 12px; bottom: 10px; margin: 0; font-size: 12px; color: var(--muted); z-index: 2; pointer-events: none;
  background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px; max-width: calc(100% - 24px); }
body.has-panel .hint { display: none; }

/* 详情面板 */
#panel { position: absolute; z-index: 6; background: var(--surface); overflow-y: auto; overscroll-behavior: contain;
  right: 0; top: 0; bottom: 0; width: min(440px, 44vw); border-left: 1px solid var(--line); padding: 18px 20px 28px; }
.pclose { position: sticky; top: 0; float: right; margin: -6px -8px 0 8px; width: 34px; height: 34px; border-radius: 50%;
  border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-size: 18px; line-height: 1; z-index: 1; }
.ptags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
#panel h2 { margin: 0; font: 600 21px/1.35 var(--font-display); text-wrap: balance; }
.psub { margin: 2px 0 0; color: var(--muted); }
.sec { margin-top: 16px; }
.sec h3 { margin: 0 0 4px; font-size: 12px; font-weight: 600; letter-spacing: .08em; color: var(--muted); }
.sec p { margin: 0; }
.sec ul { margin: 0; padding-left: 1.2em; }
.sec li + li { margin-top: 4px; }
.sec.b-gt, .sec.b-eg, .sec.b-mk, .sec.b-ai, .sec.b-jw, .sec.b-lean { padding: 10px 12px; border-radius: 8px; }
.sec.b-gt { background: var(--sunk); }
.sec.b-eg { background: var(--bg); }
.sec.b-mk { background: var(--sunk); }
.sec.b-ai { background: var(--sunk); }
.sec.b-jw { background: var(--jw-bg); } .sec.b-jw h3 { color: var(--jw); }
.sec.b-lean { border: 1px solid var(--line); }
.sec.b-done { padding: 10px 12px; border-radius: 8px; border: 1.5px solid var(--focus); } .sec.b-done h3 { color: var(--focus); }
.src { color: var(--muted); font-size: 12.5px; }
.lnks { display: flex; flex-wrap: wrap; gap: 6px; }
.lnk { border: 1px solid var(--line); background: var(--surface); border-radius: 7px; padding: 3px 9px; cursor: pointer; font-size: 13px; text-align: left; }
.lnk:hover { border-color: var(--focus); }
.lnk.nxt { font-weight: 600; } .lnk.nxt::after { content: " ↓"; color: var(--muted); }
.pyr { display: grid; gap: 8px; }
.pr .bar2 { margin: 0 auto; padding: 4px 10px; border-radius: 6px; background: var(--jw-bg); border: 1px solid var(--jw-ln); color: var(--jw);
  text-align: center; font-size: 13px; }
.pr .bar2 b { font: 600 13px var(--font-num); font-variant-numeric: tabular-nums; }
.pr p { margin: 3px 0 0; font-size: 12.5px; color: var(--muted); text-align: center; }

/* 列表 */
#list { position: absolute; inset: 0; overflow-y: auto; padding-block: 16px 40px; padding-inline: 16px; }
.lwrap { max-width: 760px; margin: 0 auto; }
.ltools { display: flex; gap: 8px; margin-bottom: 10px; }
.ltools button { border: 1px solid var(--line); background: var(--surface); border-radius: 7px; padding: 4px 10px; cursor: pointer; }
details.li { border-radius: 8px; }
details.li > summary { list-style: none; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; padding: 7px 10px;
  border-radius: 8px; cursor: pointer; }
details.li > summary::-webkit-details-marker { display: none; }
details.li > summary::before { content: "▸"; color: var(--muted); font-size: 12px; width: 10px; transition: transform .15s; }
details.li[open] > summary::before { transform: rotate(90deg); }
details.li > summary:hover { background: var(--surface); }
.lt { font-weight: 600; }
.ls { color: var(--muted); font-size: 12.5px; }
.lbody { margin: 0 0 8px 18px; padding: 10px 14px 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; min-width: 0; }
.lbody .sec:first-child { margin-top: 0; }
.lkids { margin-left: 12px; padding-left: 8px; border-left: 1px dashed var(--line); }
details.li.flash > summary { background: var(--jw-bg); }
details.li.d0 > summary .lt { font: 600 20px var(--font-display); }
details.li.d1 > summary .lt { font-size: 16px; }

@media (max-width: 859px) {
  #panel { left: 0; right: 0; top: auto; bottom: 0; width: auto; max-height: 58%; border-left: 0; border-top: 1px solid var(--line);
    border-radius: 14px 14px 0 0; box-shadow: 0 -10px 30px rgba(0,0,0,.16); padding: 14px 16px calc(22px + env(safe-area-inset-bottom, 0px)); }
}
@media (max-width: 560px) {
  .bar { grid-template-columns: 1fr auto; padding: 8px 16px; }
  .brand small { display: none; }
  .search { grid-column: 1 / -1; grid-row: 2; }
  .search input { max-width: none; }
}
@media (hover: none) { .hint .kb { display: none; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; scroll-behavior: auto !important; } }
</style>
</head>
<body>

<header class="bar">
  <div class="brand"><h1>获客全链路</h1><small>锁客 → 圈客 → 成客 → 生客</small></div>
  <div class="search">
    <input id="q" type="search" placeholder="搜概念，比如：拖不起、第三锁、太贵" autocomplete="off" aria-label="搜索概念">
    <div id="results" class="results" hidden></div>
  </div>
  <div class="views" role="group" aria-label="视图">
    <button type="button" id="v-map" aria-pressed="true">导图</button>
    <button type="button" id="v-list" aria-pressed="false">列表</button>
  </div>
</header>
<main class="stage">
  <div id="map" aria-label="获客全链路导图">
    <div id="world"></div>
  </div>
  <div class="ctl" id="ctl">
    <button type="button" data-act="fit">适应屏幕</button>
    <button type="button" data-act="all">全部展开</button>
    <button type="button" data-act="none">收起</button>
    <button type="button" class="sq" data-act="out" aria-label="缩小">−</button>
    <button type="button" class="sq" data-act="in" aria-label="放大">+</button>
  </div>
  <p class="hint" id="hint">从上往下顺着读 · 点节点展开、看全文 · 拖动平移 · 双指缩放<span class="kb"> · Ctrl + 滚轮缩放</span></p>
  <aside id="panel" hidden aria-live="polite">
    <button type="button" class="pclose" id="pclose" aria-label="关闭">×</button>
    <div id="pbody"></div>
  </aside>
  <div id="list" hidden></div>
</main>

<script>
(() => {
"use strict";
const DATA = {"id":"root","t":"获客全链路","type":"group","sub":"锁客 → 圈客 → 成客 → 生客","d":"用短视频在 8 亿人里找到本来就会买你产品的人，把他从刷到你推到找你买单，再让客户源源不断。","k":["四步：锁客（起步就要成交）→ 圈客（圈进优质人群）→ 成客（全链路推进成交）→ 生客（客户生生不息）","一句话总纲：看人，不看播放量","颜色按步骤分：锁客、圈客、成客、生客各一种颜色，展开以后一眼看出一个节点属于哪一步"],"e":"用钓蓝鳍金枪鱼打比方：先确定鱼种、找对海域（锁客），再用对鱼饵（圈客），把鱼钓上来（成客），然后持续地钓（生客）。","c":[{"id":"who","t":"先判断：靠人，还是靠品牌","type":"group","d":"先看这门生意的信任挂在谁身上。挂在人身上，是 IP：靠一个具体的人建立信任，IP 也会带产品。挂在品牌上，是品牌：产品一般都归品牌，品牌下面再分产品号（看当下的转化）和品牌号（看长期的心智），KOS 是品牌把人借过来用。这张图往下走的，是「靠人」的完整打法；品牌那一支，只在「平台与账号」里放了要点。","e":"靠人：经纬自己、刑事律师杨雪、美业的大方老师。靠品牌：蜜雪冰城、喊出「Be Open」的那个运动耳机品牌。","rel":["cf_brand","plat_matrix"]},{"id":"base","t":"认命：为什么反过来做","type":"group","d":"先「认命」：普通人几乎不可能靠大流量获客。认命之后，才能接受一个完全反向的做法：从产品能成交的人出发，用内容去找这些人。","e":"一场获客课开课先摸底：现场约五分之四的人已经做了一段时间短视频，没有人粉丝过十万，也都没拿到满意的结果。后面所有内容都以这个事实为前提。","c":[{"id":"base_fate","t":"认命：普通人拿不到大流量","type":"concept","d":"今天能拿到大流量的人，要么苦到极致（负债千万、一夜白头再翻盘），要么装到极致（世界第一、花千万挑战别人做不到的事）。普通人长相、经济、能力都普通，没有流量命。认命不是终点，是换视角的起点。","k":["大 V 集体掉量至少 10 倍，翻一下你关注了两年以上的博主就能验证","靠大流量获客，本质上是一场几乎必输的赌博：赌 65 条里有一条爆","「编故事」和「搞情绪」两套流量方法走不通：普通人哪来那么多故事"],"e":"刘润 100 多万粉丝，不去采访名人时，一条视频一百多个赞、两条评论，连续十几条都这样，自然播放可能不到 5000。"},{"id":"base_people","t":"看人，不看播放量","type":"concept","d":"整套方法的总纲。每一个播放量背后都是一个真人，先问看的人对不对，再问多不多：首先得对，然后流量越大越好。","k":["1000 播放就是 1000 个人在看；400 个人里一个都没成交，到 4000 个人也不会有","高射炮打蚊子：大 V 靠百万播放的覆盖面偶尔撞死几只，覆盖面一缩就没了","圈对人群之后，正常的结果是：做出多少流量，就赚多少钱"],"e":"一位帮游乐场老板做设计的设计师，只有 200 多个粉丝，变现超过 1000 万。换个说法就懂了：有 200 多个游乐场老板关注了他，他成交了十来个。全国游乐场老板本来也就一万多个。"},{"id":"base_hidden","t":"获客不显化","type":"concept","d":"你永远看不到别人的后台，只看得到前台的播放和点赞，于是把「流量大」脑补成「赚得多」。人群精不精准同样不显化，没人会告诉你。","k":["低数据不代表低营收，高数据也不代表有客资","判断看的人是谁：看评论内容、头像和网名、搜索词","对标账号的前台数据，不能当成功的证据"],"e":"宁波一位餐饮老板的快问快答拿到 400 多万播放，后台毫无线索：他要找的是想加盟的人，而那几条爆款视频（私域怎么运营、老板看营业额）看的全是已经开了店的老板。"},{"id":"base_reverse","t":"反向获客：从产品出发","type":"concept","d":"传统路径是先做大流量，再从流量里找钱。反向路径是先回答「你的产品能成交什么样的人？」，再 8 亿人里找这种人。核心动作：让每一个关注你的人，都有可能被成交。","k":["圈人群符合生意的本质：短视频就是一对多的销售对话","低播放也有对应的成交：100 播放赚 100 播放的钱","关注不变的东西：消费者永远是刷到你、关注你、点进账号翻、觉得靠谱就买"],"e":"美业的「大方老师」专治玫瑰痤疮，三千多粉丝：每月至少 60 人付 199 元前端，三分之一转化，客单价约 5 万，一年做到 1200 万，公司只有两个人。","x":"「又泛又精准」做不到：人刷一条视频最多停 3 秒，不同人群的兴趣根本不同，没有时间让你先泛后筛。","cf":["cf_platform"]},{"id":"base_shift","t":"赚钱能力正在迁移","type":"concept","d":"二十年里财富更替了五轮：做生意就赚钱 → 抓住品类风口 → 选址定天下 → 做线上、买流量 → 懂得吸引客户上门的人赚钱。供给饱和之后，赚钱越来越靠营销和销售能力。","k":["渠道正在拿走大部分利润：某坚果电商品牌 13 亿营收，利润只有 1300 万左右","你还活着，只是因为渠道还没死","最该全心做获客的行业：高客单、重决策，比如知识付费、律师、地产、招商、美业、留学、移民"],"e":"长沙一位律师，七年里客户全靠一位大哥介绍，每年赚 500 万，买了 18 套房。大哥车祸去世那天，她的渠道就断了，只能自己获客。"},{"id":"base_ip","t":"先获客，别盯着「做 IP」","type":"concept","d":"那些被叫作 IP 的头部账号，其实一直在获客，只是在获客路上粉丝量做大了。最好的办法是一开始就赚钱，越做规模越大。","e":"经纬自己：10 万粉之前没人说他是 IP，现在别人说「你 IP 做得真好」，他只是粉丝攒多了。"},{"id":"base_practice","t":"刻意练习，不下牌桌","type":"concept","d":"所有访谈式 IP 都练过。销售式表达靠集中、高强度练出来；做了就别中途下牌桌，下了就回不来。","k":["2023 年经纬花 20 万请人 5 天拍满 100 条，不要结果，只要练","把「我太忙了」拉黑：太忙等于用努力代替做选择","他 2023 年带过的学员，现在有六到七成已经找不到人"],"e":"成都一位年营收 4000 多万的老板，交 18 万给上海一家机构代做，自己不操心，最后零结果。出镜的是你，你自己不会销售式表达，谁也帮不了。"},{"id":"base_boss","t":"老板只做三件事","type":"concept","d":"老板只做获客、分钱、搭体系，永远不当救火队长。客户难搞，先问「我怎么让这样的人跑进来了」。","e":"他在前端一直讲自己的理念，来找他的客户开口就是「老师你好，冒昧一早打扰你，主要想委托你们团队做全案合作」：客户在前端已经被教育明白，同事只需要解决问题，不需要解决人。"},{"id":"base_team","t":"团队：批量生产操盘手","type":"concept","d":"线上团队的上限就是 IP 的上限，要靠流程批量培养「既懂业务，又懂文案，又懂短视频」的操盘手：内训 → 笔试 → 每天写选题 → 周三选题会 → 周复盘 → 月度考核。","k":["招人看软素质多于硬技能：营销思维、用户思维、商业敏感度、遇到困难不退","营销思维三问：今天给谁看？卖给他什么产品，或改变他什么认知？让他怎么看下去？","面试最重要的一问：你是怎么说服你的老板接受你的方案的","高底薪买能力，比高提成更能留人；单月 100 万以内不需要合伙人"],"e":"用这套流程，半年培养出三个操盘手；以前是三年才出五个。"}]},{"id":"s1","t":"锁客","type":"step","sub":"起步就要成交","d":"拍视频之前，先在脑子里想清楚你的产品到底能成交谁。这一步不产生任何内容，但锁错了，后面所有努力都白费。","k":["写出你的产品能成交的人，禁用「25 到 35 岁」「想变美的人」这类标签","回答挑人三问：谁觉得自己的问题值这个钱？他在什么阶段觉得值？谁愿意付出刷视频和改变自己的成本？","写出你最熟悉、最懂其心理活动的人，从你过去的经历里找，不从市场里找","画一条买单前、买单后的分界线，把现有内容一条条归类，落在买单后的一律停掉","同桌测试：说两三句话他一定被打动的人是谁？说不出来就是没锁对"],"gt":"过关：发完视频有咨询，并且这个咨询你能成交；正价品能稳定成交，才算方向对。不满足：回第一锁换人，或回第三锁换阶段，不要先去追流量。","e":"河北一位律所主任，原来讲泛刑事内容，流量大但月营收只有 2 到 5 万。改锁「职务类犯罪当事人及其家属」后，新视频播放少了一百倍，24 个转发、2 个赞，月营收涨到 50 到 100 万。","mk":"这一步还可以往前拆几格：需求起点、动力（痛痒爽）、画像与认知状态，以及开工前的四个开关，见下面的节点。","c":[{"id":"s1_std","t":"唯一判定标准","type":"concept","d":"播放量不能证明你对，咨询量也不能。唯一能证明方向对的是：发完视频有咨询，而且这个咨询你能成交。0 到 1 是成交的 0 到 1，不是流量的 0 到 1。","k":["更严格的标准：正价品能稳定成交；引流品不算","一个月内见不到钱，第二个月继续努力、做出更多流量，也不会变对","拿到第一单，说明人群是对的；随着表达和拍摄越来越熟，它会像雪球一样滚大"],"e":"长沙一个客户，2023 年一个月 2 万个咨询，月成交 40 万；现在咨询只有 1000 到 3000 个，月营收 400 多万。大流量带来的咨询，未必是你能成交的。","cf":["cf_lead"]},{"id":"s1_l1","t":"第一锁：锁产品能成交的人","type":"concept","d":"产品是世界上最挑人的东西。它挑三样：谁觉得自己的问题值这个钱；他在什么阶段觉得这个问题值这么多钱；谁愿意付出额外的成本。","k":["值钱的是问题，不是你的能力：华与华给蜜雪冰城做符号收 600 万，因为 4 万家门店每家每月多赚 100 块就回本了","有需求不等于是你的客户：线上找人天然有麻烦成本，楼下就有的，他不会上网找你","额外成本有两种：刷视频本身花的时间，以及改变自己的成本","同桌测试：跟同桌讲 3 到 5 分钟你的「一击即中」客群，打动不了同桌，就是没锁对"],"e":"一位保险理赔律师：「外卖小哥猝死」那条几十万播放、零客户，家属不觉得这个问题值 3 万律师费；改拍「先天性疾病拒赔」，病拖得起、金额大几十万，掏 3 万律师费换 40 万赔付，算得过账，才有人买。","rel":["s3_block","s3_comp"]},{"id":"s1_l2","t":"第二锁：锁你自己熟悉的人","type":"concept","d":"算法把每个人关进兴趣的小房间。你能吸引的，是你最懂其心理活动的人：熟悉他的痛苦、兴趣和感动。人们不是在找最好的、最对的，而是在找最懂自己的人买单。","k":["你熟悉的人，一定是你过去经常接触、接触最密切的人","不懂他，内容再对，他也会觉得「你跟我不是一类人」：理性上觉得需要，感性上接受不了"],"e":"两条教幼儿园园长做流量的视频：一条讲「幼儿园环境怎么拍？一分钟给你三个要点」，讲得对但看不下去；另一条开口问「如果现在重来一次，在你知道会面临这么多压力和责任的情况下，你还会选择当园长吗？」，讲园长被夹在检查、家长、老师中间的处境，园长一看就觉得被懂了。","ai":"检验标准：你能不能写出这类人心里想、却没说出口的 10 句话。","rel":["lk_one"]},{"id":"s1_l3","t":"第三锁：锁用户买单前的阶段","type":"concept","d":"获客的分水岭在买单那一刻：买单前叫获客，买单后叫交付。获客内容只做一件事：让他从「不觉得需要」变成「觉得需要」。这一关卡死了九成做线上的人。","k":["获客内容不是解决问题、不是彰显你多厉害、不是展示真才实学，是让他觉得这件事很重要","获客就是销售：你是公司最大的销售，不是最能解决问题的那个人","最难的是心态关：放下你想讲的真相和独到见解，等他花钱之后再讲"],"e":"一条普拉提视频里一次都没出现「普拉提」：教练跟一个腰痛的人对话，说疼痛来自日常过度前倾，要做脊椎还原。腰痛的人看完，从「不知道怎么办」变成「普拉提能解决」。","x":"打个比方：在大马路上支一个水缸教路人游泳，没人看。路人不觉得自己需要游泳。","mk":"用户从刷到你到买单，走五步：看见 → 兴趣 → 信任 → 笃定 → 买单；买单前这一段，就是前四步。见「五步」节点。","cf":["cf_stage"],"rel":["lk_stage"]},{"id":"s1_l4","t":"第四锁：锁买单前感兴趣的选题","type":"concept","d":"不抄对标，选题要能锁住你的人群。最常用的办法：把衣食住行、吃喝玩乐对着你的客群聊一遍；也可以聊你的专业，但只讲「买单之前，这件事为什么重要」，不讲「买单之后，这件事怎么解决」。","k":["对标没用的两个原因：他的人群跟你不一样；他有没有获客，你根本不知道","消费者买单前不关心产品，也不关心专业，只关心「我想解决的问题，你怎么看？」","饭局原则：在 20 个陌生人的饭局上，没人想听你怎么定价、怎么解决问题"],"e":"假设你卖一辆两万块的自行车，五个选题：「骑行的火不是没道理的」「受不了跑步的苦就去骑行」「新手买车别买这么便宜的」「杭州情侣周末骑行度假线路」「最潮的杭州年轻人解压运动」。没有一个在讲车的性能。","mk":"关键词、搜索和选题公式，见「选题与关键词」节点。","cf":["cf_bench"],"rel":["lk_kw"]},{"id":"s1_live","t":"定人、定专属问题","type":"concept","d":"精准获客也可以压成四步：定人、定专属问题、定内容、定营销目的。前两步就是锁客：只服务一类顾客，越窄越好；再定这类人专属的那个问题，让他觉得「互联网上那么多博主，为什么非选我不可……因为我专门解决这个问题」。","k":["定人：窄到你自己都怀疑会不会太少了。我们本来就没什么流量，流量中等注定是常态","定专属问题：市场越细分，越有高客单和高利润","后两步（定内容、定营销目的）对应圈客和成客"],"e":"「如果你是做教培的，你能不能就只服务高考模拟分数，在 450 分到 520 分之间的人」。经纬自己找康复师，就找专门擅长足踝康复的。","x":"和四锁的关系：定人约等于第一锁加第二锁；「定专属问题」是在四锁之外多强调的一点。"},{"id":"s1_sw","t":"开工前的四个开关","type":"method","d":"骨架不变，开关决定后面每一步的参数。开工前先把四个开关拨好。","k":["起点：有产品（未验证、未跑通、已跑通），还是没有产品","价值类型：功能、情绪、资产，决定你打效率、打感受，还是打保值","价格带与决策链：冲动价到重决策；一个人决定，还是多人说了算","买用关系：买的人和用的人是不是同一个"],"e":"脑白金：买的多是送礼的子女，用的是老人，所以广告讲给送礼的人听。","rel":["s1_start","ref_ln","s3_price","s1_buyuse"]},{"id":"s1_origin","t":"需求起点：内生型与外促型","type":"concept","d":"让需求从「没有」变成「有」的那件事，它本身不是购买理由。分两类：内生型来自人性底层，没有期限，要靠内容去唤醒；外促型来自外部事件，有期限，可以按时间点做选题日历。","e":"被裁、下周面试、快毕业，是外促型；想知道自己到底是什么样的人，是内生型。","x":"和第一锁里的「阶段」是一件事的两面：需求起点回答需求为什么出现；阶段回答「他在什么阶段觉得这个问题值这么多钱」。"},{"id":"s1_drive","t":"动力：痛点、痒点、爽点","type":"concept","d":"推他买的力量，三类并列，可以叠加。痛点是怕；痒点是想成为的样子；爽点是当下立刻得到。","k":["痛点要具体：有数字或场景、有代价、他能用自己的话说出来","助推项只放大、不创造动力：紧迫度、同侪压力、熟悉度、当时的状态","爽点测试：去掉「立刻」两个字，理由还成立吗？还成立的偏痒点"],"e":"「投了 20 份简历，零回复，怕再白白浪费时间」是痛点；「想进更好的公司」是痒点；「改完马上看到前后对比」是爽点。","x":"痛点是恐惧，爽点是即时满足，痒点是虚拟自我。别和情绪价值的三个付费点混在一起：保障感、愉悦感、彰显性。","cf":["cf_pain"],"rel":["s3_emo","ref_ln"]},{"id":"s1_persona","t":"画像、人设与认知状态","type":"concept","d":"画像是能看到或能倒推的显性背景，内容改不了，只用来决定去哪找人、用什么语气。认知状态是他此刻怎么理解自己的问题，内容能改。人设是他给自己立的身份。画像是刚需时代的工具，适合以功能价值为主的刚需品；人设是丰饶时代的工具，一个人的长项就是他的需求，越擅长越需要更多。","k":["后台能看到的：年龄段、性别、城市、设备","最有用的是行为：他看什么、收藏什么、评论什么、买过什么","看不到的学历、收入、性格，只算待验证的假设","检验办法：一条内容能不能改变它？能改的是认知状态，改不了的是画像"],"e":"同样是零回复：他觉得是市场不好，内容就先帮他换个归因；他已经知道是简历的问题，内容就直接给方向。","x":"「25 到 35 岁」这类社会化标签不用，它对选题几乎没有指导意义。"},{"id":"s1_scene","t":"场景：先穷举，再筛选","type":"method","d":"场景：「场」是时间和空间，「景」是情境和上下文。没有产品场景匹配，就没有产品市场匹配。先穷举所有场景，再识别出强场景：周期性出现的场景，是习惯产生的地方；让用户感知更强烈的场景，更值得做。场景越具体，产品越有力。","k":["判断一个产品会增长还是衰落，看它的场景是在扩大还是在收缩","「做大学生市场」太粗了，要落到一个具体的强场景"],"e":"王兴做校内网时，识别了一个强场景：放寒假，学生要坐火车回家。放到你的话题里：大三、临近秋招、没有实习经历，是应用场景；秋招开始，是需求起点；周四晚上躺床刷手机、焦虑，是环境。","x":"场景可以拆成两层：应用场景（人生阶段加处境，相对稳定）和触发时机里的环境（此刻的现场）。","rel":["lk_trig"]},{"id":"s1_buyuse","t":"谁买、谁用：做的是谁的生意","type":"concept","d":"先分清谁付钱、谁使用、谁影响决定，也就是你做的是谁的生意。","e":"红娘案例：五十多岁的红娘做不了年轻人的生意，年轻人不会找她；她能做的是年轻人父母的生意，所以开头要对家长说话。","rel":["t_biz"]},{"id":"s1_start","t":"有产品、没产品：两条起点","type":"method","d":"有产品：先看成交数据判断它在哪个状态，再找竞品和对标。没有产品：先假设用户和场景，找证据，确认真需求成立后再定产品雏形，用小成本做最小验证。","k":["未验证：真实成交（不算熟人、不算刷单）不足 20 笔","未跑通：满 20 笔，但下面三条有一条不满足","已跑通：可重复（最近 4 周至少 3 周有成交，来自至少 3 条不同内容）、可归因（至少六成成交能说清谁因为什么买）、单笔不亏","最小验证：用小成本内容加预售或候补名单，真实付费或留资才算，只点赞不算"],"e":"没有产品时的一种走法：先访谈、挖竞品评论区，再放一份 3 页的免费小样，看有没有人留资或问价。","ai":"20 笔、六成、4 周这些阈值是默认值，没有行业数据，按你的流量量级再改。"}]},{"id":"s2","t":"圈客","type":"step","sub":"圈进优质人群","d":"锁客解决「我要谁」，圈客解决「怎么让他看到我」。只有一个标准：看视频的人，就是你要成交的人。靠四个圈一层层筛：开头、画面、内容、观点。","k":["开头四选一：兴趣话题、兴趣表达、兴趣人物、兴趣观点；不用「你是不是正在遭遇……」这类痛点开头","蹭人物前先问：这个人是我的客群关心的吗？不是就不蹭，哪怕他是全网热点","画面自检：我的客户会觉得这个画面美吗？不是你觉得美","内容自检：在每段话里强行加「各位××」，检查是不是始终在对同一类人说话","观点自检：这个观点比我的客群高一点点，还是高太多"],"gt":"过关：评论、头像、私信里的人，和你锁的人对得上。不满足：一圈一圈查，先查开头，再查画面、内容、观点。评论区全是同行，说明只有同行看得下去。","e":"同样 3 万播放的两条餐饮招商视频，讲的是同一个观点。一条开头「线下现在还有什么流量洼地」，圈到的是连锁老板，0 个客资；另一条开头「现在好多品牌开始做社区店」，圈到的是想开店的人，8 个客资，其中一个付了 22 万加盟费。","c":[{"id":"s2_open","t":"第一圈：开头圈","type":"concept","d":"开头本身就是一个圈：喜欢就看下去，不喜欢 0.01 秒划走。不要为了把口子撕大去搞流量；开头要圈「美好的东西」：他感兴趣的话题、表达、人物、观点。","k":["兴趣话题圈：对一个大众熟知的话题讲你的看法，再落回你的业务。比如用大 G 开头，最后落到「你的产品做到 85 分，宣传却是 0 分」","兴趣表达圈：话题一般，但表达带一点无伤大雅的「不正常」，用意境一致的抽象词","兴趣人物圈：只蹭你客群关心的人物，热点再大也不蹭无关的人","兴趣观点圈：反驳、质疑或重新定义客群脑子里已有的观点，必须有刷新感"],"e":"「真正的有钱人，百分之一百住别墅」引来的是没钱的人在评论区抬杠；「南通 240 平大平层，到了施工过程中非常重要的一个节点：中期验收」，看的是南通 200 平以上的业主，评论区有人说「我在湖南，希望你从南通过来跟我做」。","x":"圈问题、圈现状的开头（「你家小孩是不是学习的时候拖拉磨蹭？」）也算圈人，是常规手法，但不够好：一是「没有人刷短视频时希望被唤醒痛苦」；二是目的性太强，「你开口就已经把枪顶到我脑门上了」。这不等于回避痛：一条带来 114 万营收的视频（播放 1.4 万），核心表达就是一个痛，「做直播最可怕的不是你做不起来，而是你不知道怎么莫名其妙就火了，也不知道怎么莫名其妙就凉了，这种心里空落落的感觉才最难受」；「做某某最痛苦的就是某某阶段」也是一种常用拍法，用阶段锁定那个阶段的人。要避开的是一开口就追问对方有没有这个问题，不是讲痛本身。","mk":"看场景，痛点开头也可以用：开头放大痛点，后面给解决方案，让他往好的方向走。","cf":["cf_pain"]},{"id":"s2_visual","t":"第二圈：画面圈","type":"concept","d":"目的就是美：好不好看由客户定义，不由你。客户看完更喜欢你、更信任你，就是美。短视频不是做自己，是一场舞台剧，是让你成为客户心中最认可的那个服务商。","e":"卖柑橘化肥的父子：父亲穿得朴素、话不多，像地里干活的人，去年利润 2200 万；儿子农大毕业、穿得白净、讲修剪的专业知识，去年四十万。","x":"第 28 章说「画面不重要」，指的是场景精不精致不重要；画面传递出的身份感觉非常重要，两者不矛盾。"},{"id":"s2_content","t":"第三圈：内容圈","type":"concept","d":"每条视频都在跟特定的一类人对话，而不是发表所谓正确的看法。「说清楚」只对同频的人成立；把一件事讲得非常正确，往往只有同行跟得上。","k":["矫正办法：拍的时候强行在句子里加「各位老板」「各位家长」","评论区出现很多同行，说明你在用同行喜欢的画面、观点和语言说话"],"e":"一条香港保险的视频：开头圈到的是「已经买过保险、想升级方案」的人，后面却讲第一次买保险的人才需要的跑友猝死故事，对这批人来说早就听烂了。"},{"id":"s2_view","t":"第四圈：观点圈","type":"concept","d":"好的观点不是正确的观点，是比你的客群稍微高一点点的观点。没有真相，只有主张：你的客群能接受到什么程度，最重要。","e":"同一个把摩托车做到世界第一的创业者：讲「屌丝逆袭」吸引屌丝；讲「一生只做一件事」吸引四五十岁的实业老板；讲「越大的老板越要懂业务」吸引年入百万到千万的中小老板。","x":"常熟一位做了 23 年的红娘坚持讲「定位」，观点完全正确，但家长听不懂也不接受；改成对家长说「孩子说『没感觉』不可怕，找不到对的人才可怕。别再让孩子在同一个圈子里反复兜圈子」，解决的是亲子矛盾，才圈住了家长。"},{"id":"lk_one","t":"共鸣：让他觉得你跟他是一类人","type":"concept","d":"「一类人」的感觉不是一条视频喊出来的，是好几层叠出来的：你锁的是你本来就熟的人；你开口讲的是他的处境，不是你的方法；你的样子像他心里那个靠谱的人；你的观点刚好比他高一点；你有过来人的身份；你用的是他自己的原话；你一直在讲同一个理念。","k":["熟：只锁你过去经常接触的人（第二锁）","讲他：说中他的处境和心里话，不讲你自己的糟心事（内容圈）","像：形象符合他心中最美好的那个服务商（画面圈）","刚好高一点：观点不超出他的认知（观点圈）","过来人：「我之前也是这样」（成客里的讲身份）","原话：钩子用评论区里他自己的说法","同一个理念：刷你 3 到 5 条就知道你相信什么，他才会觉得同频（生客）","关系四次第里，「认同」是分界线、是忠诚的开始：明明白白地认同「我们一样」「我们是同类」"],"e":"饭局原则：「我在饭局上就一个目的，让你觉得我这个人跟你是同一类人。」所以经纬自己的账号里也聊吃什么、补剂、运动、焦虑型的人一定不是好客户，因为他的客群也关心这些。","mk":"共鸣是触发点的前提：他看到了什么（刺激），先觉得「说的就是我」，才会想通什么（新认知）。「一类人」没做出来，后面的触发点都不起作用。","x":"例外：爽点型的即时刺激（限时低价、秒杀）可以绕过共鸣直接触发，但只适合低价、冲动型的产品。","rel":["s1_l2","s3_identity","lk_formula"]},{"id":"lk_trig","t":"触发时机：环境 + 触发点","type":"concept","d":"触发时机 = 环境 + 触发点。环境是他此刻的现场（时间、行为、状态），你只能选；触发点是内容里让他「想动」的那一下，你能写。","k":["环境三格：时间（半夜、起床后）；行为（无目的地刷，还是主动在搜）；状态（情绪加认知）","常量不进表：渠道固定在一个平台，就不用单独记"],"e":"同一个人，同样半夜焦虑地刷手机，今晚刷到两条笔记，一条划走，一条点进了商品：区别就是触发点。同一条笔记，白天上班摸鱼刷到和半夜焦虑刷到，效果也不同：区别是环境。","rel":["lk_formula","lk_types","s1_scene"]},{"id":"lk_formula","t":"触发点公式","type":"concept","d":"他看到 ____（刺激），觉得是在说自己（共鸣），意识到 ____（新认知），所以此刻想 ____（行动倾向）。核心是新认知；共鸣是前提，行动倾向是结果。","e":"他看到一条笔记「同样零回复，改完这三处，第二周约到 5 个面试」，配前后对比，觉得说的就是自己，意识到「我零回复可能不是市场的问题，是简历的问题」，所以此刻点进去看资料包。","x":"获客内容要让他「从不觉得重要到觉得重要」，说的就是新认知这一格。"},{"id":"lk_types","t":"触发点五类","type":"concept","d":"按他意识到了什么，分五类。","k":["纠因：原来问题不在我以为的地方","新解法：原来还能这样解决","拖不起：再等下去要出问题","相似案例：和我一样的人成了","降门槛：钱少、事少、险小"],"e":"「不是市场不行，是简历的问题」是纠因；「每多投一周，存款少一周」是拖不起；「同样零回复，改完约到 5 个面试」是相似案例；「改几个字就能投」是降门槛里的事少。","x":"拖不起必须基于真实的代价；虚构的限时、限量越线了，见「夸大的边界」。","cf":["cf_urgency"]},{"id":"lk_stage","t":"五步：看见、兴趣、信任、笃定、买单","type":"concept","d":"用户从刷到你到买单，一定会经过五步：看见 → 兴趣 → 信任 → 笃定 → 买单。用它判断他现在走到哪一步、这条内容要把他往哪一步推；低价冲动品会把几步压在一条内容里走完。","k":["看见：靠圈客的四个圈。这时他多半还没意识到自己需要","兴趣：理念型视频，让他觉得这件事很重要","信任：信任型视频，刚好比他高一点的专业，加上专业的感觉","笃定：成交型视频，让他确定你能解决他的问题；信任不等于成交，他可能同样信任别人","买单：通知型视频，开课、上新","起点不同：内生型的人多半从看见开始，开头要先唤醒；外促型的人常常已经到了兴趣甚至信任（直接在搜简历模板），开头可以直接给答案"],"e":"被裁第 12 天、投了 20 份零回复的人，多半已经在「兴趣」这一步：他在找办法，只是还不知道问题出在简历。朋友转给他一条视频，只是让他从「看见」开始，后面几步还得靠内容走完。","x":"这是从大量销售和营销的书里总结出的规律，例子是给父母买燕窝。另一种分法是买单前、买单后两段，配理念、信任、成交、通知四类视频。","ai":"营销上另有一套「认知五阶段」（Eugene Schwartz）：无意识、问题意识、方案意识、产品意识、完全意识，可以拿来给关键词分类。","cf":["cf_stage"],"rel":["lk_kw","s3_live","s3_four","s1_l3"]},{"id":"lk_kw","t":"选题与关键词","type":"method","d":"选题的方向在第四锁里定（锁人群的选题）；这里补三样：关键词按用户走到五步的哪一步来分、选题公式、给自己的内容打标签。","k":["关键词按用户走到哪一步分：痛点词（领导总针对我）、场景词（秋招、面试前）、情绪或结果词（迷茫、想换赛道）、方案词（性格测试）、产品词（某个测评的名字）、决策词（哪个准、靠谱吗、避坑）","人群词（大学生、职场新人）只是修饰词，没人只搜「大学生」然后下单","选题公式：触发类型 × 他在五步的哪一步 × 内容形式","内容标签：给每条已发内容打主题、需求类型、开头钩子、形式和时长、目标人群阶段、目标行为，攒到 30 到 50 条再看规律"],"e":"「秋招前（场景）× 还在看见这一步、没意识到问题 × 避坑清单（形式）」就是一条选题。","ai":"搜索很重的平台，笔记能被长期搜到，比如小红书七成以上月活用户会搜索，2024 年底日均搜索量接近 6 亿次。不做搜索电商、不像淘宝那样卖货，不等于不要笔记被搜到带来的流量。","cf":["cf_platform"],"rel":["s1_l4","t_tag","plat_diff"]}]},{"id":"s3","t":"成客","type":"step","sub":"全链路推进成交","d":"圈对了人只是第一步，第二步是打动他。要破两个执念：「因为我专业」和「用结果说话」；然后用传递感觉、塑造身份，以及四类视频的组合，一步步推到成交。","k":["每条视频在「问题」和「答案」之间，插入过来人、高位者、有结果三种身份里你真有的那一种","设计一个能传递感觉的画面或肢体细节：合影的姿势、场景、同事的状态","拍成交型视频：让客户复述「我是谁、我遇到什么问题、我买单前有什么顾虑、我怎么说服自己的」，不要问「你觉得我们怎么样」","每月固定发 1 到 2 条通知型视频：开课、上新，纯广告，不指望流量","文案只写不超过 100 字的框架：开头加三四个骨架点加结尾，其余现场发挥"],"gt":"过关：关注你的人里，有人主动来问价、问开课时间，成交周期在缩短。不满足：先看阻碍清单里卡的是哪一项；信任型视频够了，就补成交型和通知型。","e":"一位大健康博主，原来讲「如何四周有效减掉内脏脂肪」，拍得像坐牢；改成在镜头前开心地玩解压玩具：他的客户常年亚健康、高兴不起来，要的就是「感觉你很健康，感觉你很快乐」。成交周期从 7 到 15 天缩到一天，营收从 300 多万到 500 多万。","mk":"他为什么买、为什么没买，还可以拆得更细：影响下单的因素、阻碍清单、竞品、塑品、承诺、价格带、情绪下单，见下面的节点。","c":[{"id":"s3_def","t":"成交的定义","type":"concept","d":"成交就是看完就想买。过了今天他就忘了你，所以最好当场打动、当场签单。付钱才是真正的关系：人花了钱，自己会给这件事添加意义，付得越多意义越大。","k":["不做成交的三个后果：在给同行培养客户；指望客户自己想明白；做公益，涨粉不赚钱","影响力、粉丝量、播放量都会过去，只有成交是真的"],"e":"经纬见过、聊过不下 30 个人说「第一年白做」：一整年没见到钱。为什么一年都没醒悟？因为每天都在涨粉，所以一直以为自己在正确的路上。"},{"id":"s3_feel","t":"感觉很专业 > 真的很专业","type":"concept","d":"专业是很私人的感受：30 分的人只能理解 31 分的专业，看到 80 分的反而觉得是骗子。顾客听不懂真专业，只能感觉到。信任 = 刚好比他高一点点的专业 + 有专业的感觉。","k":["买单前看感觉，买单后看事实","企业内部只有成本，成果在外部（德鲁克）：你的独家方法是成本，不是宣传点","顺应客户脑子里已有的认知，教育成本最低：六个核桃靠「以形补形」卖了多年"],"e":"经纬放了自己两条讲方法论的视频，问现场能不能给方法打分，没人能打，但都觉得「很专业」：因为有白板、在写字、说话有模型、概念名字取得讲究。","cf":["cf_feel"]},{"id":"s3_identity","t":"讲身份：过来人、高位者、有结果","type":"concept","d":"「讲真相」是让你自己舒服的；获客靠的是在问题和答案之间塑造身份。三种身份不冲突，你有哪个就讲哪个。","k":["过来人：我经历过，我曾经跟你一样。带来确定感和避坑感，也带来「一类人」","高位者：我比同行厉害，通过对同行一定程度的不屑来体现","有结果：先把结果摆在前面，再讲方法和答案"],"e":"上海的娟姐从没卖过房，改造后的视频只讲一件事：她在这个小区做了 13 年包租，累计管过 120 多套房，自己就是这个小区的业主，闭着眼都能画出小区地图。你不信中介，但你信原业主。","mk":"建立信任靠成功案例和背书：能告诉他，你可以解决他的问题、满足他的需求。转介绍等于有了朋友支撑的信任背书。","ai":"信任可以拆成四种：能力信任、真实信任、匹配信任、风险信任。对上三种身份：过来人约等于匹配信任加真实信任；高位者和有结果约等于能力信任；风险信任靠承诺和退款。身份可以讲得有感觉，但不能编，见「夸大的边界」。","cf":["cf_feel"],"rel":["lk_one","s3_promise"]},{"id":"s3_scene","t":"用画面传递感觉","type":"concept","d":"感觉有两种传法：语言（讲身份）和画面。画面里有什么人、什么东西、人物的表情和气质，都在替你说话。这类理由来自客户脑子里本来就有的印象，不挑客户的学历和认知。","e":"经纬和一位客户拍视频时，让客户把脚放在他大腿下面。一位卖柑橘化肥的老板看完说：「他作为你的客户，你们两个人关系那么好，他的脚都放在你腿下面，那说明你业务能力一定很不错，不然你的顾客跟你关系不会那么好。」这位成了他那年最好的客户。"},{"id":"s3_result","t":"「用结果说话」打动不了人","type":"concept","d":"结果不会骗人，但结果打动不了人。一切后端交付的真实水平，都是消费者买单前感知不到的：你知道同行没做到而你做到了，消费者不知道，隔壁也会这么说。","e":"英国一位房产中介的口号「交房率 100%」，换了四版都不对。改拍住宅区楼下的泰国餐厅探店，反而来了客户：家长给在英国的孩子买房，最担心的是孩子没人照应，要找的是一个熟悉本地衣食住行的人。"},{"id":"s3_four","t":"四类视频与信任递进","type":"concept","d":"一条视频不可能完成成交，客户买单前会打开你的账号一条条往下翻。账号里要有四类视频组合：理念型、信任型、成交型、通知型。","k":["信任型：刚好高一点的专业，加上专业和靠谱的感觉","成交型：拍给已经关注、已经相信、但还在犹豫的人，扣动最后那个扳机","通知型：开课、上新，纯广告，流量非常小，但钱都来自通知型","理念型：账号的心脏，见「生客」"],"e":"一位新能源车企创始人的账号：交付细节、拜访同行、财报、长途自驾、沙漠漂移、赛道调头、品控测试，一条条把你对这个品牌的信任度从 10% 推到三四十。","mk":"放进营销金字塔（从单条、多条到营销策划）里看，多条这一层就是这四类视频的分工。","rel":["s3_mp","s4","plat_ratio"]},{"id":"s3_proof","t":"成交型视频：让客户复述决策过程","type":"method","d":"不要问客户「你觉得我们怎么样」，那是买单后的评价，没买的人共鸣不了。要问他：你是谁、遇到了什么问题、买单前有什么顾虑、是怎么一步步说服自己的。用他说服自己的过程，去说服跟他一样的人。","e":"墓地销售也拍得出来：「叔叔，你配合我拍摄一下，我最终会给你打码的。」「不方便。」「我也会把你的声音处理掉。」「还是不方便。」「我们这边中午有餐券，你配合我拍摄，我中午给你两张餐券好不好？」「那你多给我一张。」三张餐券换来的那条视频，六万多赞，几百万播放。","cf":["cf_feel"]},{"id":"s3_live","t":"成交铺垫：一个号推完五步","type":"concept","d":"买单要走五步：看见 → 兴趣 → 信任 → 笃定 → 买单。账号里不同视频各管一步，叫「成交铺垫」：成交之前，他的好奇、担忧、顾虑已经全部被视频铺垫完。要做的是一个号，不是一条视频。","k":["「太贵了，我再考虑考虑」「不知道适不适合自己」，很多时候不是价格问题，是产品价值没介绍到位；价值不到位，报价就是见光死","把干货嵌进具体问题里：专业人士要帮他分析买单前的问题（怎么选、会不会被坑、风险多大），不是回答买单后的问题（怎么做）","消费者在找你之前充满恐惧，甚至不敢咨询，因为「咨询你就是任你宰割」"],"e":"经纬做牙齿矫正前在网上做功课，最后选的那家，账号把他买单前关心的问题全讲了：不同机构报价为什么差这么多、都说手艺好为什么还有那么多售后问题、矫正完会不会过几年变回去、手术失败的风险有多高。","x":"和买单前不讲专业不矛盾：买单前可以把这件事怎么选、怎么判断讲透，买单后的怎么解决留到付费之后。","rel":["lk_stage","s3_block"]},{"id":"s3_factor","t":"影响下单的因素：促成 + 阻碍","type":"concept","d":"公式：成交 ≈ 促成因素 − 阻碍因素，但要先过决定性的门槛。它不是严格的减法，是促成够不够压过阻碍；动力越强，他对阻碍的容忍度越高。买前列因素，买后归理由。","k":["促成因素：痛点、痒点、爽点，加上助推项（紧迫度、同侪压力、熟悉度、当时的状态）","阻碍因素：见阻碍清单","决定性因素：缺了就是零。有需求、知道有这类解法、懂不懂、适不适合；高价时还有信不信","加权因素：值不值、麻不麻烦、有没有风险，可以被强动力部分弥补","附加因素：朋友推荐、同侪压力，有则更容易成交，没有也能成交"],"e":"被女朋友分手的男生，愿意花高客单找人帮忙挽回：动力很大时，他对信不信、值不值的要求会被压低。好奇型这类动力弱的需求，阻碍必须压到极低。","x":"贝克哈德-哈里斯改变公式说的是同一件事：不满 × 愿景 × 第一步 > 改变的阻力。左边是乘法，任何一项为零，改变就不会发生，这就是决定性的门槛。也可以压成「缺口、路径、代价」三问，是同一结构的另一种写法。","rel":["s3_block","loop_attr","s1_drive"]},{"id":"s3_block","t":"阻碍清单","type":"concept","d":"他在商品页停了一分钟没付款，心里卡的那句话。每一项都是假设，用评论区里的疑问句去验证。","k":["懂不懂：买了到底拿到什么","适不适合：对我这种情况有用吗","信不信：这个人靠不靠谱","值不值：这个价钱对不对得起","麻不麻烦：要跳几步、费多少力","有没有风险：买错了怎么办","比不比：为什么不用免费的，或者自己搞定","用不用得起来：买了会不会吃灰","丢不丢人：找人帮忙，是不是说明我不行","付不付得起：它是上限，不是主因","谁说了算：高客单时，要不要问家人或伴侣"],"e":"「AI 都帮我改了三版，还是零回复，你凭什么有用？」这一句同时卡在比不比和适不适合。","x":"对应到前面的做法：感觉、身份、成交型视频，压的主要是信不信和适不适合；「有需求不等于是你的客户」「楼下就有」，说的就是比不比和麻不麻烦。","rel":["t_block","s3_comp"]},{"id":"s3_comp","t":"竞品要按广义算","type":"concept","d":"竞品是他不买你的时候，用来解决同一个问题的其他办法。分四层：直接竞品、间接竞品、免费方案、不处理。「不处理」和「问 AI」往往是最大的对手。","k":["找竞品从用户的问题出发，不从你的功能出发","没有竞品时逐层判断：先放宽口径；还是没有，看替代办法、求助、付费三类信号；有信号，就跨行业找同一类缺口的类比；全都没有，大概率是伪需求","差异五格：对手给不了他什么？数据、视角、判断、交付终点、承诺与责任"],"e":"纽约卖房案例：本地人楼下就有中介，不会上网找她。她真正能成交的是人在外州、房子在纽约的业主，以及已经找了中介、房子却一直卖不掉的人。「楼下就有」就是最强的竞品。","rel":["t_comp","s1_l1"]},{"id":"s3_package","t":"塑品与交付终点","type":"concept","d":"塑品是把产品包装成一眼看懂、愿意买的样子：名字、交付物怎么呈现、卖点、价格锚点、组合。交付终点是做到哪一步算完：给信息、给判断、给成品、给过程、给结果。越往后，边际成本越高。","k":["最后一公里：他拿到东西后还要自己做的部分，对应「用不用得起来」","负责到结果，不等于承诺结果：求职结果取决于市场和他自己","KANO 检查：期望属性必须确定性地交付到，否则就是智商税"],"e":"你的打车比喻：免费方案常常只把人送到地铁口，好的交付把人送到家。19.9 到 39.9 元的虚拟资料，现实里大多只能做到给信息、给判断、给成品这三层。"},{"id":"s3_promise","t":"承诺与可衡量","type":"concept","d":"承诺有边界，边界内可追责。三问：承诺什么（要可验证）、什么算做到、没做到怎么办。可衡量的本质，是让他不必相信你，也能自己判断。","k":["可预览：付钱前先看到一部分，比如样例页、目录、自查清单试看","可核对：有标准，他自己能对照，比如「报告包含这 5 个部分」","可追责：做不到有说法，比如退款、补改一次"],"e":"「付款后 24 小时内未收到报告，支持全额退款」是可追责；「24 小时没出结果支持退款」有歧义，用户会读成「没找到工作就退款」。","rel":["s3_exag","s3_identity"]},{"id":"s3_exag","t":"夸大的边界","type":"concept","d":"分两层。做人做事守底线：不夸大的前提是真实，要站在用户角度，让内容可衡量，数据上的夸大才是真正的夸大。做营销可以松一些：在不改变本意的前提下适当夸大，去促成成交，目的一定要向善，但不是昧着良心说违心的话。","k":["本意没变：用户知道实情后，他的决定会不会变？会变就越线了","拿得出来：用户问一句「能看看吗」，你拿得出东西","目的向善：这一单对他本人是好事","交付是真的：用户在你这里真的感受到交付、感受到真情实意","营销松的是讲法，不是事实：可以挑最好的真实案例、讲具体、讲得有感觉；数字、身份、价格、效果不改。这几样是法律线：信息与实际情况不符、对购买有实质影响的，虚构使用效果的，拿虚构或无法验证的统计资料作证明的，《广告法》都算虚假广告；虚构原价按《明码标价和禁止价格欺诈规定》属于价格欺诈。以现行法规为准"],"e":"经纬自己的账号说「越是 985、211 的编导，越愿意做出爆款视频」，团队里确实有五六个 211，这是讲得有感觉的真话；直接写「我们公司全员 211」，用户一核对就破，就越线了。直播间说「只需要原价249，现在我给你们抹掉200块钱」，最后「只需要49」：店铺平时真卖 249，就是真实的促销；从没按 249 卖过，就是虚构原价。","ai":"数字为什么不松：用户如果是冲着某个数字来的，这个数字就是他做决定的依据，改了数字就等于改了本意；数字也最容易被核对、被投诉。","x":"两层的分界：道德上，营销可以比做人松；法律上，营销反而更严，因为广告要对它说的每一个事实负责。","cf":["cf_feel","cf_urgency"]},{"id":"s3_asset","t":"资产三态与三层价值","type":"concept","d":"页面上每句卖点，都要有对应的资产。资产分三态：已有（现在就拿得出来）、要做（你自己说了算，比如承诺条款、样例页）、要获取（依赖外部或时间，比如学员案例、专家背书）。「要获取」的东西不能先写成已有。","k":["他买的不只是功能，还有信息和信号：功能是问题被解决；信息是知道问题出在哪、该怎么办；信号是有人确认「我没错，我选对了」","信号要建立在真实的判断上，不能靠说好话换来的「好准」（巴纳姆效应）"],"e":"39.9 元的职业性格测评：60 道题、10 页报告模板是已有；请做过招聘的朋友上线前审一遍模板，是要做；学员案例是要获取。「有时候，我们买的其实就是别人的肯定」，说的就是信号这一层。","rel":["t_asset"]},{"id":"s3_price","t":"价格带、心理账户与「太贵」","type":"concept","viz":"pyramid","d":"价格决定成交路径有多长。价格带是默认关系，痛感可以改写它。心理账户决定他付不付、付多少：他把这笔钱放在哪个口袋里比。","k":["痛点层级：L1 好奇或小不便；L2 有代价但还能忍；L3 有明确代价、有期限；L4 高风险、高情感","「太贵」有三种意思：付不起、不值、比别的贵。靠行为和每次只改一个变量的实验判断，不靠追问","从 39.9 做到 199，不是改一个价格，是痛点层级、信任方式、交付终点三格同时往上移"],"e":"同样是豆沙，食堂的红豆火烧 3 元一个，烘焙店的日式蜜豆面包 15 元一个，付款时都不觉得不对：一个在「主食」账户里，和馒头包子比；一个在「甜品」账户里，和牛角包蛋糕比。","ai":"金字塔的切点（30、100、500 元）是假设，没有数据。校准办法：看对标账号同类商品各价格档的销量，以及评论里「便宜、试试」和「靠谱吗」各占多少。","cf":["cf_lead","cf_price"],"rel":["loop_diag","ref_ln"]},{"id":"s3_emo","t":"情绪下单","type":"concept","d":"公式：情绪被唤起，情绪和商品是同一个主题，在情绪退下去之前，把下单的阻力压到最小。三样缺一不可。","k":["唤起：情绪 = 生理唤起 + 认知标记。同一块蛋糕，对小孩是开心，对正在节食的女孩是罪恶感","同主题：情绪要有出口，买的是身份表达或仪式感，比如结婚时买红色的东西、自豪时买国货","阻力最小：冲动价、一步下单、当下就能拿到","付费点：为保障感付费是对抗担心，为愉悦感付费是对抗枯燥，为彰显性付费是对抗自卑"],"e":"雷军的发布会：公布价格前十分钟，讲一个同事工作十年攒钱买了「梦想之车」，每天早上踩下油门就热血沸腾，最后一句「人生值得被奖励」。消费者买单前 99% 是理性的，最终掏钱的那一刻一定是感性的。","mk":"你操盘时第一条自然流出单的爆款，本质是塑造一个从逆境里走出来的人设，「营造出一种情绪，利用情绪去带动用户做决策」。","x":"适用边界：低价、情感价值高、即时满足的产品。价格一高，情绪一退就是退款；心理类产品尤其要守住承诺边界。","cf":["cf_emotion"],"rel":["s1_drive","ref_ln"]},{"id":"s3_mp","t":"营销点与营销金字塔","type":"concept","d":"营销点是一条内容里，让用户离成交更近一步的那件事。五类：缺口类（唤醒或强化需求）、路径类（证明能解决）、代价类（降低代价）、关系类（让他更认可你）、行动类（推他迈出下一步，每次只要一个动作）。一条内容通常只主打一两个。","k":["营销金字塔：营销策划（账号层：卖给谁、抓什么痛点、立什么人设、主打什么卖点）→ 内容矩阵（一组视频的分工，用四类视频）→ 单条视频（找谁、讲哪个场景、主打哪个营销点）","执行自上而下，数据自下而上回流","定营销目的：每条视频都植入营销目的，让人有被种草、被安利的感觉，而不是在看广告"],"e":"一条内容主打「适不适合」：用相似案例压阻碍，结尾只放一个动作，推他看商品页。","rel":["s3_four","plat_ratio"]}]},{"id":"s4","t":"生客","type":"step","sub":"客户生生不息","d":"前三步解决「这一单怎么成」，第四步解决「明年、后年还能不能成」。线上流量在往下走、竞争在往上走，解决它的工具只有一个：理念。","k":["写出你的理念：不是方法，是你一贯相信什么、推崇什么，是对「问题解决方向」的浓缩","用四步公式推广：认同或反对一个大众观点 → 拆解背后的底层逻辑 → 用生活和行业案例讲你的理念 → 不给方法，留白","列出你可以反对的社会现象和约定俗成的说法，这就是源源不断的选题库","自检：观众刷你 3 到 5 条视频，能不能准确说出你相信什么"],"gt":"过关：刷你 3 到 5 条视频的人，能准确说出你相信什么；同行抄你，客户还是认你。不满足：查你的理念是不是其实在讲方法；查内容是不是都在重复同一件事。","e":"刑事律师杨雪在同类账号里全网领先，账号上只写了一句话：「希望成为家属们温暖而坚实的后盾。」会见当事人、给法学院上课、发「其实你不用假装没事，你可以哭出来」，每一条都在说同一件事：律师也可以很温暖。","c":[{"id":"s4_why","t":"理念是获客的终局","type":"concept","d":"流量红利往下走，竞争往上走，你一直在骑车上坡。粉丝量不是护城河。明年流量掉一半，你还能稳住业务的那个原因，从做账号的第一天就要想。","k":["不考虑终局的三个后果：更新得越多，账号越乱；一有人抄你，你就被动；平台不给流量，你只能买流量"],"e":"2019 年踩着红利起来的人，本质上能力没变，是电梯在往上走；2023 年电梯停了，他的增长也停了，因为真正的竞争能力从来没建立起来。"},{"id":"s4_power","t":"理念的三个力量","type":"concept","d":"足够简单：做得越多，你在他脑子里越简单。指引方向：给想不清楚的人一个方向。复利：理念跟流量红利无关，是做得越久越吃香的终身资产。","k":["理念排在信任前面：大多数人不买，不是不信你，是压根没觉得这件事重要","输出理念是在点醒用户；输出干货是在回应已经想清楚的人","不给客户说「但是」的机会：用理念引领，「往这个方向就对了」"],"e":"张雪峰十几年只讲一件事：高考改变命运。你可能没看过他几条视频，但孩子高考选专业的时候，你会考虑他。"},{"id":"s4_three","t":"找对、推广、践行","type":"method","d":"找对：理念在你行为的下面，可以从消费、创业、成长、关系四个维度去找。推广：用理念的视角解读世界，用四步公式，留白不给方法。践行：所有故事、经历、观点、行为都在重复同一件事。","k":["方法不是理念，方法是成本：「圈人群」是经纬解决问题的方法，他公开讲的理念只有一句「一定要获客」","站队就有源源不断的素材：你主张什么，就有一个对立面可以反对","理念不要标新立异，也不要策划一个你不是的人，你演不了那么久"],"e":"经纬做直播服务时的理念是「过程越细，结果越大」：讲直播要复盘、复盘要细、讲颗粒度，连做饭也做复盘。很多人来找他，说的就是认同这句话。"},{"id":"s4_card","t":"名片短视频与私域升级","type":"method","d":"做一条几分钟的名片短视频，讲清你是谁、公司做什么、能帮谁解决什么问题、怎么解决，置顶在朋友圈。微信的本质是社交推荐，转发一条视频比打字介绍有用得多。","k":["激活微信里那些几年不说话的好友","不用费劲聊天，把名片视频转过去","它是一个 24 小时不停的销售，还可能带来公域流量","再配几条干货类、成交类视频，让老顾客帮你转发"],"e":"朋友给他推荐一位培训老师，在微信里拼命打字说老师多好，他无动于衷；他自己去老师的视频号，把个人介绍、产品介绍、团队介绍三五条视频转给朋友，朋友态度 180 度大转弯。","ai":"放在限制站外导流的平台上（比如小红书），私域导流要走官方的私信留资工具，见「平台的区别：人群、规则、审美」。","cf":["cf_word"],"rel":["plat_diff"]},{"id":"s4_filter","t":"服务业的本质是筛客户","type":"concept","d":"服务业的本质不是专业，是筛选客户。只有线上有足够多的精准客资，你才有资格不要付费能力低、特别难缠的人，专心服务好客户、做出大案例，再用好案例吸引更好的客户。","e":"经纬开广告公司时，一天最多 3 个客户上门，靠老客户转介绍，一直在同一个圈子里打转；做账号三年、30 多万粉丝之后，一天三五十个客户来咨询，可以挑了。"},{"id":"s4_back","t":"后端：激活、留存、复购、升单","type":"concept","d":"低价前端品的钱主要在后端。后端回答四件事：他买完之后怎么用上、怎么留下、怎么再买、怎么帮你带人。","k":["激活：第一次用上并得到价值，交付终点和最后一公里决定这一格","留存与复购：关系四次第，需要 → 喜欢 → 认同 → 归属；「需要」这一层最容易被替代","升单：价值阶梯，免费引流品 → 低价前端品 → 核心品 → 高价服务，每一级都必须真有价值，否则用户会离开阶梯","推荐：推荐同时在压阻碍、触发、放大动力；转介绍是一条成交路径"],"e":"你操盘过的一条漏斗：视频下挂十元级的前端品，买了的人加微信、进 3 天直播，再转成千元级的正价课。后端哪一环断了，前端的单子就只是低价单。","ai":"AARRR（获取、激活、留存、变现、推荐）里，前端获客之后，激活和留存这两格要单独看。","cf":["cf_word","cf_lead"],"rel":["case_mk","s3_package"]}]},{"id":"loop","t":"复盘与验证","type":"group","d":"四步里每一步都是假设。主线是贝叶斯：先有先验，小成本去测，拿证据更新。","k":["先验：对标的评论区、竞品的买家评价、你自己的经历","证据：分层看指标，每一层回答不同的问题","更新：样本不足就继续测；成交理由和假设一致，才放大；不一致，回到锁客"],"gt":"样本不足（不到 20 笔）继续测；成交理由与假设一致、小闭环跑通，才放大；不一致，回锁客修正。","e":"你操盘时的投流测法就是一次标准的回路：一条挂车素材先建 3 个计划，每个 100 块智能投放；不出单，说明痛点错了；出单但单价高，再分是投放的问题还是素材的问题；最后在用户分层表上打勾或打叉。","c":[{"id":"loop_bayes","t":"贝叶斯回路","type":"concept","d":"先验 → 证据 → 更新。先验是你对「谁会因为什么买」的假设；证据是小成本测试的结果；更新是修正你对这个假设的信心。","k":["「唯一判定标准」就是这条回路的终点：有咨询、能成交","别用播放量去更新成交假设","被吸引的人和愿意付费的人要分开看"],"e":"播放很高、成交很低，通常说明钩子吸引的是好奇的路人，不是有付费意愿的人。"},{"id":"loop_metric","t":"指标分层","type":"concept","d":"每一层指标回答一个不同的问题，不要跨层下结论。","k":["完播、前几秒留存：钩子有没有抓住人","收藏、转发、评论：内容有没有引发认同","点击、咨询、加购：有没有购买意向","成交：假设成不成立"],"e":"河北律师改造后的新视频：24 个转发、2 个赞。转发多、点赞少，是因为当事人家属不敢公开评论，只会私下转给具体的人：「老张，你这个事儿要不要先筹划筹划，要不要找这位律师问问？」只看点赞就会误判。"},{"id":"m_cmt","t":"评论区挖掘","type":"method","d":"把评论区当需求的原始数据。分四类：想买、质疑、求助、吐槽。求助和质疑价值最高，因为那是还没被满足的需求。","k":["竞品的评论区、别的平台、别的领域都能看，前提是人群和需求一样","剔除水军和广告号；不收集个人信息","原话是弱证据，行为是强证据，两者冲突时信行为"],"e":"判断开头圈没圈对，就看评论区：「有钱人敢不敢住别墅」这种抬杠，说明圈错了人；「我在湖南，希望你从南通过来跟我做」，说明圈对了。","rel":["s2_open","loop_attr"]},{"id":"loop_real","t":"真需求的检验","type":"method","d":"看行为，不看夸奖：有没有人已经为这件事花过时间或花过钱。夸奖、泛泛的「我会买」、对功能的建议，都不算证据。","k":["三类信号：替代办法、求助、付费","The Mom Test：问他过去做过什么，不问他将来会不会","别人的夸奖不是证据，用户增长曲线才是"],"e":"一款 AI App：父母施压、问你让你痛苦的问题时，它帮你回复，顺便做心理疏导。「这样的产品我可能会用，但你要我付费的时候我就不会付费了」。会用和会付是两个决定。"},{"id":"loop_attr","t":"归因规则","type":"method","d":"买前列因素，买后归理由。只归评论里有证据的那一层，其余标「未知」，不要拿自己的推演去补。","k":["买完之后的感受，不等于买之前的理由","至少 20 笔成交再看比例（默认值）"],"e":"「看到有 HR 审核过才敢买」只能证明信不信这一项被压低了，看不出他的动力是什么。把它判成痛点加拖不起，是把推演当成了证据。","rel":["t_attr","s3_factor"]},{"id":"loop_diag","t":"转化低怎么办：怎么查","type":"method","d":"每一步都用行为证据，不靠用户自述。人群和价格并列查：来的是不是目标人群，价格和价值感有没有问题，同时看；再看漏斗卡在哪一层。","k":["来的人不对：回锁客，改人群","卡在点击：问题在内容或商品页的吸引力","卡在咨询到付款：按「太贵」的三种意思，每次只改一个变量做实验","没人问价：不是价格问题，回内容和承接","另一种查法：价值明明成立、市场却不动，一定是感知、想象、场景、利益相关人四个环节里至少一个卡住了"],"e":"经纬 7880 元的直播课，现场没人愿意买。同样的价格，「已经做过直播、已经拿到过结果，但结果正在往下掉」的人就觉得值，因为他们算得清这笔账。人和价是缠在一起的，所以要一起查。","cf":["cf_price"],"rel":["s3_price"]},{"id":"loop_closed","t":"小闭环","type":"method","d":"放大之前，先在一个小市场里，把产品、用户、媒体、渠道、终端、团队的假设全部跑通、得到印证，再去复制。","e":"1998 年脑白金只在江苏江阴启动：史玉柱先亲自找老人做了上百次访谈，派试用装、开座谈会，再委托生产、培训员工；大量赠送之后，老人拿着空盒子去药店买不到，药店到处找货，这时才打广告，并定下「款到提货」。江阴一仗提出几十万现金，所有假设都得到印证，再去无锡如法炮制，一年做到月回款近千万。"}]},{"id":"plat","t":"平台与账号","type":"group","d":"平台和账号是放大器，不是底层：锁客、圈客、成客、生客的顺序在哪个平台都一样。在哪个平台发、用什么账号、四类视频各发多少，都跟着两件事走：你的人群在哪，你卖的东西决策有多重。","e":"同样做获客：卖几十块资料的，一条内容就能从看见走到买单，在平台里直接挂车；接几万块案子的律师，内容只负责筛人，成交在私信和电话里谈。平台、账号、配比都跟着变。","cf":["cf_platform"],"c":[{"id":"plat_diff","t":"平台的区别：人群、规则、审美","type":"concept","d":"同一套获客逻辑，换平台只在三层上有区别。人群：同一个品类，各平台的主力人群可能不一样。规则：能不能留联系方式、能不能挂链接、私信和留资走什么工具，决定成交链路有多长。审美：什么样的画面、封面和说话方式能让人看下去。","k":["先看人群：同品类账号的粉丝和评论区里是什么人","再看规则：成交要不要离开这个平台，离开走哪条路平台允许；几十块的东西在平台里直接挂车最顺，几万块的服务要进私信和电话，先查这个平台怎么留资才合规","再看审美：同品类做得好的十个账号，封面、画面、说话方式有什么共同点","搜索重的平台，内容要带上用户会搜的词：搜「被裁后简历怎么改」的人已经在了解阶段，开头可以直接给答案","过度承诺在哪个平台都容易违规，比如「三天你在我这里，我一定让你拿到一个结果」「前期只要 1980，后面费用都不用」；根子是人群不清楚，只能简单粗暴"],"e":"微信里，转发一条名片视频比打字介绍有用，因为它靠熟人关系推荐。小红书上，用户觉得经纬太「装」，不符合她们对「人类高质量男性」的想象，他在那里做得最差，这是人群和审美那一层；规则那一层，小红书七成以上月活用户会搜索，私信留资只能走官方工具，在笔记、评论里留微信号算违规。","ai":"平台规则常变，发布前以平台规则中心的当前版本为准；挂资料包、测评这类虚拟商品前，还要查对应类目的售卖规则。素材常被判违规时，建一个违规库：把每条素材的违规原因抽成敏感词，剪辑时避开。","x":"和「底层不变」不矛盾：四步的顺序在哪个平台都一样，变的只是这三层。","rel":["lk_kw","s4_card"]},{"id":"plat_matrix","t":"账号和品牌：靠人还是靠品牌，要不要拆号","type":"concept","d":"靠人的，一个 IP 号起步，信任挂在人身上。靠品牌的，再拆号：品牌号管心智，产品号管转化；KOS（关键意见销售）是品牌让门店店员、员工开号，由品牌号统一管理，相当于把人借过来用。品牌传播和效果获客是两个目标：品牌传播面向现在没打算买的大多数，看声量和偏好，回报以年计；效果获客面向正在买的少数人，看咨询和成交。","k":["什么时候值得拆号：受众不同或风格冲突；已经有一个号跑通了闭环；有人力让每个号都推得起来","小团队早期默认一个号，用四类视频在号内分工","理念型视频，本质是对准一小撮目标人群的品牌传播","常被引用的「品牌六成、效果四成」来自大型消费品牌的研究，不适合直接套到小生意上","出圈爆款的流量价值、人设价值是真的，转化价值取决于看的人是不是你的人群：吐槽老东家的视频，看的人得是求职者"],"e":"一个连锁品牌：品牌号讲品牌故事，产品号发新品和转化内容，每家门店的店员各开一个 KOS 号，由品牌号统一管理，能看到每个号带来的咨询和成交。","cf":["cf_brand"]},{"id":"plat_ratio","t":"内容配比：按品类起步","type":"method","d":"没有固定比例。起点按你卖的东西决策有多重来定，再跟着最卡的那一段调。唯一确定的数：通知型每月 1 到 2 条。","k":["几十块的资料、小物件：一条内容就能从看见走到买单，成交型、通知型可以多发","一两百到几百的课程、测评：要多次刷到才下单，信任型要多","几千上万的服务（律师、装修、医美、咨询）：内容只负责筛人，理念型、信任型为主，成交在私信和咨询里","再按最卡的那一段调：看的人不是目标人群，多做理念型，先用四圈检查；看的人不进主页、不关注，是信任没立住，多做信任型；关注了不咨询、不成交，多做成交型和通知型"],"e":"同样是理念、信任、成交、通知四类：卖 39.9 元测评的号，一条视频就可能直接成交，成交型、通知型可以多发；接几万元案子的律师号，几乎都是理念型和信任型，成交在私信和电话里谈。","ai":"这几档起点都没有数据，是按决策轻重推出来的；发一个月，再按最卡的那一段去调。","rel":["s3_four","s3_price"]}]},{"id":"tools","t":"工具与案例","type":"group","d":"可以直接填的表，以及两家拆开的真实公司。拆别人的公司，和拆你自己的生意，用的是同一张业务拆解表。","e":"拆一家公司的顺序：先填谁付钱、谁使用，再画用户从刷到到付费的每一步，最后看钱从哪里来、被谁拿走。","c":[{"id":"t_card","t":"需求卡","type":"tool","d":"一个场景一张卡，写清：应用场景、需求起点（内生或外促）、动力（痛痒爽，用原话写）、触发时机（环境加触发点）、最要紧的阻碍、广义竞品、价格带。","e":"被裁找工作这张卡：外促型，被裁第 12 天；痛点原话「投了二十多份，连个已读都没有」；环境是半夜、焦虑、无目的地刷；触发点是纠因；阻碍是比不比（AI 改过三版没用）和适不适合；竞品是问 AI、免费模板、不处理；价格在冲动带。"},{"id":"t_biz","t":"业务拆解表","type":"tool","d":"拆任何一家公司都用这一张：谁付钱、谁使用、用户怎么从刷到走到付费、交付做到哪一步、钱怎么赚（单价乘销量，或用户数乘每用户消费）、拿谁的钱、获客靠什么、渠道拿走多少。「拿谁的钱」是模式第一问，无非四种：从用户手里拿（to C）、从商家手里拿（to B）、从资本手里拿（to VC）、从政府手里拿（to G）。","e":"下面两张是填好的：一家是经纬自己的公司，一家是你操盘过的视频号项目。","rel":["case_jw","case_mk","s1_buyuse"],"c":[{"id":"case_jw","t":"拆一家：经纬自己的公司","type":"case","d":"用两份文档里讲师自己说的信息拼出来，数字都是自述，未核验。","k":["谁付钱：有产品、客资很值钱的老板，比如律师、知识付费、地产、加盟、留学、教培、大健康","获客：视频号约 16 万粉、抖音约 30 万粉，常规单条播放一万多；直播每月 5 到 7 场","前端：49 元的三天闭门直播（直播间标原价 249）","中端：线下课每月开 70 到 90 人，光线下课每月营收超过 100 万；还有方案营","高端：IP 孵化全案，一个客户 36 万，团队还分项目增量","成交：自述全公司只有一个销售，靠视频把成交铺垫好","交付：合伙人带操盘手团队，选题会、周复盘、月复盘","规模：自述年营收两三千万；38 期线下课，累计接近一个亿"],"e":"他的漏斗和他教的完全一致：公域短视频锁「已经在短视频上踩过坑的人」，49 元把人带进闭门直播，再到线下课和方案营，最后是 36 万的全案。","x":"他说「引流品没有意义，你最终的利润不来源于引流品，而是正价品」，自己仍然用 49 元做入口。引流品管入口，正价品管验证方向，两句话不矛盾。","cf":["cf_lead"]},{"id":"case_mk","t":"拆一家：你操盘过的视频号项目","type":"case","d":"你在之前一份工作里操盘的视频号项目。","k":["前端：视频下挂十元级的前端品","承接：买了的人加老师微信，老师发免费资料和问卷（问卷是你设计的）","转化：加微后进 3 天直播，第三天付费","正价：千元级的正价课","测素材：小预算、多个投流计划智能投放，先看出不出单，再看单例成本","用户分层表：选题、痛点、人群、应用场景，按数据打勾或打叉"],"e":"用四步对照：锁客是你的用户分层表；圈客是那条人设转化型视频；成客是前端品加 3 天直播。生客这一格还是空的。","x":"单量、转化率、营收这些具体数字没有放进来：这个链接现在任何拿到链接的人都能看。"}]},{"id":"t_block","t":"阻碍清单表","type":"tool","d":"每一项阻碍，配一句他心里的问法和一个压低它的办法。","k":["懂不懂 → 交付物可视化：目录、样例页、报告截图","适不适合 → 对号入座清单、同类案例","信不信 → 身份、真人、真实评价","值不值 → 塑品、价格锚点","麻不麻烦 → 缩短路径，直接挂车","有没有风险 → 退款、试看、低价试错","比不比 → 讲清和免费方案的差异","用不用得起来 → 给落地步骤","丢不丢人 → 内容里先接住情绪，把它说成正常的事"],"e":"商品页只有标题、价格和目录时，懂不懂、适不适合、比不比三项都没压，停留一分钟后划走很正常。","rel":["s3_block"]},{"id":"t_comp","t":"竞品差异五格","type":"tool","d":"对手给不了他什么？逐格填：数据（真实投递后的回复率）、视角（HR 怎么筛简历）、判断（直接指出问题在哪）、交付终点（拿来就能投的成品）、承诺与责任（退款、答疑）。每格标已有、要做、要获取。","e":"39.9 元性格测评对免费 MBTI 加 AI 解读：AI 给不了「上线前经过招聘从业者审核的岗位建议」，前提是这件事真做了。","rel":["s3_comp"]},{"id":"t_attr","t":"归因记录表","type":"tool","d":"每笔成交记一行：需求起点、主动力、触发点、环境、卡过他的阻碍、他比较过的竞品、证据原话；城市、学历这些只放「背景」一栏。","e":"「测完才知道我不适合做销售，难怪干得这么痛苦」：动力是痛点，触发点是纠因（证据是「难怪」）。要注意这是用完之后的感受，不一定是买之前的理由。","rel":["loop_attr"]},{"id":"t_asset","t":"资产盘点表","type":"tool","d":"每句卖点对一个资产，标已有、要做、要获取；要获取的，写清获取路径和周期。","e":"没有学员案例时的路径：首批体验 → 收反馈 → 取得授权 → 脱敏 → 做成案例。","rel":["s3_asset"]},{"id":"t_dir","t":"选方向打分表","type":"tool","d":"三道过滤，按顺序走：价值观（我能不能当面向家里长辈解释，我在卖什么、怎么赚钱）→ 熟悉度（能不能写出这类人心里想、却没说出口的 10 句话）→ 商业（能不能靠正价成交、决策够不够重、监管风险多高、会不会被免费 AI 替代、人口是变多还是变少）。","e":"大健康在价值观这一关就被你排除了；K12、考研、留学，卡在熟悉度。","rel":["s1_l2"]},{"id":"t_tag","t":"内容标签表","type":"tool","d":"给每条已经发出去的内容打标签：主题、需求类型（科普、避坑、教程、测评、共鸣、故事）、开头钩子、形式与时长、目标人群阶段、目标行为；再填完播、收藏、转发、涨粉、咨询。攒到 30 到 50 条，看哪类组合好、哪类差。","e":"如果「避坑类 × 新手 × 结果前置」的完播和转发明显偏高，这就是你账号自己的小型推荐模型。","rel":["lk_kw"]},{"id":"t_act","t":"作业：最痛苦的阶段","type":"tool","d":"拍一条「做某某最痛苦的就是某某阶段」的视频。先讲清你做什么，再用「阶段」锁住那个阶段的人，讲这个阶段的核心感受，说明为什么不是别的阶段。不讲方法，只建立价值感。","e":"「打网球最痛苦的阶段是 2.5 这个水平。刚开始时你能原谅自己，觉得没关系，只要上场打了就开心。但到了 2.5 之后，你就非常想打好每一个球，这种执着反而会带来痛苦和内耗。」做短视频的版本：「做短视频最痛苦的，就是你刚出第一条爆款的阶段。」"}]},{"id":"cf","t":"定下来的取舍","type":"group","d":"几处容易摇摆的地方，每一条写了结论、依据和怎么验证。","e":"比如开头要不要用痛点：看场景，两种都可以用。","c":[{"id":"cf_pain","t":"开头用不用痛点","type":"conflict","done":"看场景，两种都留：兴趣开头可以用；痛点开头也可以用，开头放大痛点，后面给解决方案，让他往好的方向走。","ai":"要避开的是「你家小孩是不是学习的时候拖拉磨蹭？」这类开头：唤醒痛苦、目的性太强，「你开口就已经把枪顶到我脑门上了」。讲痛本身没问题：一条带来 114 万营收的视频（播放 1.4 万），核心表达就是「做直播最可怕的不是你做不起来，而是你不知道怎么莫名其妙就火了，也不知道怎么莫名其妙就凉了」；「做某某最痛苦的就是某某阶段」也是一种常用拍法。区别在于讲一个阶段的痛，让对的人对号入座；而不是开口就追问对方有没有这个问题。","test":"同一个选题做兴趣开头和痛点开头两版，比看的人对不对和咨询质量，不比播放。","rel":["s2_open","s1_drive","t_act"]},{"id":"cf_lead","t":"前端引流品，还是正价品验证方向","type":"conflict","done":"两种都对，看渠道：手里有高客单的，前端挂引流品，后面接正价品；在小红书这类平台，低价资料本身就是产品，不为引流，卖的是睡后收入，一份知识可以卖无数份。","ai":"两种模式下，判断方向的标准都是「你的正价品能够稳定成交」，只是「正价品」指的是你真正靠它赚钱的那个：第一种是后面的高客单，第二种就是这份低价资料本身。第二种要把单笔账算清：售价减去平台费和获客成本，还剩多少。用 49 元闭门直播做入口，走的是第一种。","test":"第一种看引流品买家里后来进入正价的比例；第二种看低价品自己能不能稳定卖、单笔亏不亏。","rel":["s1_std","case_jw","s4_back","s3_price"]},{"id":"cf_feel","t":"「感觉」和真实的边界","type":"conflict","done":"营销可以适当夸大，但不是昧着良心说违心的话：在不改变本意的情况下去促成成交，目的一定要向善。事实和数字不动，见「夸大的边界」。","ai":"按这条线看三件事：211 只讲那五六个人，是讲得有感觉的真话，直接写全员 211 就越线；请学员把真实感受说完整可以，让他说没体验过的结果不行；客户不配合给个折扣请他出镜，只要他说的是真话就可以。","test":"用户问一句「能看看吗」，你拿不拿得出来。","rel":["s3_feel","s3_exag","s3_proof"]},{"id":"cf_emotion","t":"情绪用不用","type":"conflict","done":"看人群：有些人群就吃这一套，一切以人群为主去做成交。","ai":"和整条链的根一致：先锁客，人群定了，后面怎么说、用不用情绪都跟着定。","test":"同一人群里，情绪型和理性型内容带来的成交，比退款率和复购。","rel":["s3_emo","s1_l1"]},{"id":"cf_platform","t":"平台到底有没有区别","type":"conflict","done":"有区别，但底层不变：一是人群不一样；二是平台规则不一样，引流链路跟着变，具体玩法要微调；三是风格偏好不一样，比如小红书很吃审美，用户刷内容的视觉逻辑，和看抖音、视频号完全不同。","ai":"经纬自己三个平台里小红书做得最差，原因是小红书的用户觉得他太「装」，这就是审美那一层。规则这一层的事实：小红书七成以上月活用户会搜索；2025 年起私域留资只能走官方工具。","test":"不需要单独测。","rel":["base_reverse","plat_diff"]},{"id":"cf_bench","t":"对标还有没有用","type":"conflict","done":"有用，拆开借：视频形式和画面呈现，跨领域都能借；好的金句、升华点是怎么策划的，值得学；选题只在对方的产品和用户跟你一样时直接借，不一样就分析他为什么这么做。另外，大流量和获客的内容很明显能看出来：他重复发的那些，流量可能并不好但还坚持在发，获客的概率可能很高，但也不是一定的。","ai":"看他有没有重复发的内容，正好补上「他到底有没有获客，你根本不知道」这个难处：后台看不到，但他反复在发的东西，说明对他有用。流量不好还坚持发，是最强的信号；不一定的原因是，他也可能只是习惯了、没看数据，或者那条是为了别的目的（比如维护老客户）。","test":"不需要单独测。","rel":["s1_l4","m_cmt","base_hidden"]},{"id":"cf_word","t":"口碑和转介绍","type":"conflict","done":"转发的视频只是让朋友从「看见」开始：有了朋友之间的信任，就跟点拼多多一样，他碍于面子、碍于对你的信任和你俩的关系，可能就会点；后面还是要经过那五步。另外，付费的产品很少很少会被推荐给朋友，通常是基于某个具体场景；免费的才绝对会推荐给朋友。","test":"统计朋友转发来的人，最后有多少走到了买单。","rel":["s4_card","s4_back","lk_stage"]},{"id":"cf_brand","t":"IP 还是品牌：信任挂在谁身上","type":"conflict","done":"分 IP 和品牌两种：产品一般都归品牌，个人很难自己做产品，所以产品并进品牌；IP 也会带产品。","ai":"品牌下面打法还分两种：产品号看当下的转化，品牌号看长期的心智，衡量方式不同；KOS 是品牌把人借过来用。这张图往下走的，是「靠人」的完整打法，所以图的最上面加了一层「先判断」。","test":"不需要单独测。","rel":["who","plat_matrix"]},{"id":"cf_stage","t":"买单前走几步","type":"conflict","done":"五步：看见 → 兴趣 → 信任 → 笃定 → 买单。","ai":"「没意识」不单列一步：它就是他刚「看见」时所处的状态。","test":"不需要单独测。","rel":["lk_stage","s3_live","s1_l3","s3_four"]},{"id":"cf_urgency","t":"限时、倒计时和「拖不起」","type":"conflict","done":"限时、倒计时可以用，前提是不改本意、目的向善；原价、名额、开课时间得是真的。","ai":"虚构原价、虚假限量不在「适当」范围里：按《明码标价和禁止价格欺诈规定》，虚构原价属于价格欺诈。店铺平时真按 249 卖，直播间的 49 就是真实的促销价。","test":"照搬前确认三件事：原价真的卖过；名额真的有限；开课时间真的固定。","rel":["lk_types","s3_exag"]},{"id":"cf_price","t":"没人买：是人不对，还是价也不对","type":"conflict","test":"别靠他嘴上说的「贵」，他不一定说实话，要看行为。两件事同时看：来咨询的人里目标人群占多少，看人对不对；同一批目标人群面对正价和更低门槛的选项（拆小份、分期、先买低价版）怎么选，看价对不对。低价版买了，是价格问题；低价版也不买，是价值没讲清，或者产品本身的问题。","ai":"同一个价格，对不同阶段的人值不值不一样：7880 元的直播课，做过直播、拿到过结果、但结果正在下滑的人就觉得值，因为「只要恢复到原来的水平，学费就赚回来了」。所以人和价缠在一起，要一起看。","done":"人和价并列查，不分先后：没人买，可能是找错了人，也可能是价格或价值感出了问题。","rel":["loop_diag","s3_price"]}]},{"id":"refs","t":"外部框架","type":"group","d":"从外部借来的几套框架。另外，图里案例的数字多是当事人自述，没有核验过，看方向就好，别当精确数据。","e":"价值公式、The Mom Test、Fogg 行为模型、PAS 与 AIDA，都在这一支里。","c":[{"id":"ref_ln","t":"价值 = 功能 + 情绪 + 资产","type":"ref","d":"价值公式：产品价值 = 功能价值 + 情绪价值 + 资产价值。所有价值都站在需求的视角看：功能价值是客观的，情绪价值是主观的，资产价值依赖集体的共识。","k":["功能价值：买效用和效率，能用参数描述、标准化交付；讲它就晒参数、配置、数据和性价比。它的经典死法叫「匪兵甲」","情绪价值：情绪 = 生理唤起 + 认知标记；心理账户决定付不付费、付多少，新市场常常是开出了新的心理账户；付费点是保障感、愉悦感、彰显性。经典死法叫「貂丁」：自嗨拼凑，情绪体验没有在用户身上真实发生","资产价值：可持续变现，就有资产价值。两个条件：有一个可以持续变现的专门市场或二手市场；价格依赖某个共识。买资产是投资不是消费，所以一降价反而没人买","产品创新，就是创造新功能、新情绪、新资产"],"e":"资产价值：房子、茅台、爱马仕、黄金，都有二手市场和共识。梭罗在瓦尔登湖自己盖的房子（花了 28.115 美元）有功能价值和情绪价值，但没有产权、进不了二手市场，所以没有资产价值。钻石靠戴比尔斯减产、制定 4C 标准、「钻石恒久远」才维持住资产价值，人造钻石把它打回了「电钱」。","x":"对你的产品：资料包、测评、课程几乎没有资产价值，因为没有二手市场。说理念「做得越久越吃香，它是终身复利资产」，是比喻，指你自己账号的积累，不是用户买到的资产价值。值得问自己：3 年后，你是靠能力赚钱，还是靠资产赚钱？"},{"id":"ref_ext","t":"其他方法","type":"ref","d":"几套外部框架，各管一件事。","k":["The Mom Test：夸奖和泛泛的「我会买」是坏数据，承诺和推进才算","JTBD 任务地图：把客户完成一件事拆成定义、找资源、准备、确认、执行、监控、修正、收尾","PAS 与 AIDA：已经有痛感的人用 PAS（问题、放大、方案），还没意识到的用 AIDA（注意、兴趣、欲望、行动）","Fogg 行为模型：行为 = 动机 × 能力 × 提示","认知五阶段：无意识、问题意识、方案意识、产品意识、完全意识","AARRR：获取、激活、留存、变现、推荐","Van Westendorp 价格敏感度四问：多少钱太便宜、便宜、贵、太贵；只能划区间","品牌与效果：品牌建设面向暂时不买的大多数，效果投放收割已有需求"],"e":"用 Fogg 模型看挂车出单：他本来就有动机和信任，挂车把下单变成一步，视频只是在对的时刻提醒了他。"}]}]};
/* 颜色按步骤分：每个节点跟它所在那一步同色；旁支（平台、工具、取舍、外部框架）不上色 */

const TYPES = { group: "分组", step: "步骤", concept: "概念", method: "方法", tool: "工具", case: "案例", conflict: "取舍", ref: "参考" };
const byId = new Map();
(function idx(n, p, d) { n.p = p; n.depth = d; byId.set(n.id, n); (n.c || []).forEach(c => idx(c, n, d + 1)); })(DATA, null, 0);
const pal = n => { if (!n.p) return ""; let x = n; while (x.p && x.p.p) x = x.p; return STAGE_PAL[x.id] || "nt"; };

  s3: "看的人对了，下一步打动他", s4: "这一单成了，下一步让客户源源不断", loop: "每一步都是假设，拿成交来验证" };
const LOOPBACK = "对不上，回到锁客";

const $ = s => document.querySelector(s);

/* ── 内容 ── */
const para = s => s ? `<p>${esc(s)}</p>` : "";
const list = a => a && a.length ? `<ul>${a.map(x => `<li>${esc(x)}</li>`).join("")}</ul>` : "";
const sec = (label, html, cls) => html ? `<section class="sec ${cls || ""}"><h3>${label}</h3>${html}</section>` : "";
const links = (ids, cls) => {

function pyramid() {
  const rows = [
    ["500 元以上", "重决策带", 52, "L3 到 L4，要个性化；真人背书、熟人推荐、一对一沟通；内容只负责筛选，成交在私域或咨询"],
    ["100 到 500 元", "考虑带", 68, "L3：有明确代价、有期限；案例、背书、退款，常要多次刷到才下单"],
    ["30 到 100 元", "轻决策带", 84, "L2；样例、少量评价、退款承诺；59 到 99 元适合做过渡品"],
    ["30 元以内", "冲动带", 100, "L1 到 L2，或靠痒点、爽点；一条内容完成唤醒和成交"],
  ];
  return sec("价格带金字塔（切点待校准）", `<div class="pyr">${rows.map(r => `<div class="pr"><div class="bar2" style="width:${r[2]}%"><b>${r[0]}</b> · ${r[1]}</div><p>${esc(r[3])}</p></div>`).join("")}</div>`);
}
function contentHTML(n) {
  let h = "";
  if (n.type === "conflict") {
    h += sec("结论", para(n.done), "b-done") + sec("依据", para(n.ai), "b-ai") + sec("怎么验证", para(n.test));
  } else {
    h += sec("定义", para(n.d)) + sec("过关条件", para(n.gt), "b-gt") + sec(n.type === "step" ? "动作" : "要点", list(n.k));
    if (n.viz === "pyramid") h += pyramid();
    h += sec("例子", para(n.e), "b-eg") + sec("延伸", para(n.mk), "b-mk") + sec("补充", para(n.ai), "b-ai") + sec("区分", para(n.x));
  }
  const si = SPINE.indexOf(n.id);
  if (si >= 0 && si < SPINE.length - 1) h += sec("顺着往下", links([SPINE[si + 1]], "nxt"), "b-next");
  if (n.id === "loop") h += sec("对不上，回到", links(["s1"], "nxt"), "b-next");
  h += sec("相关取舍", links(n.cf)) + sec("相关", links(n.rel)) + sec("下一层", links((n.c || []).map(c => c.id)));
  return h;
}

/* ── 导图 ── */
const HG = 44, VG = 10, LP = 84;
const branchKids = n => !open.has(n.id) ? [] : (n.id === "root" ? (n.c || []).filter(c => !SPINE_SET.has(c.id)) : (n.c || []));
const branchCount = n => n.id === "root" ? (n.c || []).filter(c => !SPINE_SET.has(c.id)).length : (n.c || []).length;
function nodeHTML(n) {
  const p = pal(n), bc = branchCount(n);
  const cls = ["node", p ? "p-" + p : "", "t-" + n.type, n.id === "root" ? "root" : "", SPINE_SET.has(n.id) ? "spine" : "", n.id === selected ? "sel" : ""].join(" ");
  const cnt = bc ? `<span class="cnt">${open.has(n.id) ? "收起" : "展开 " + bc}</span>` : "";
  return `<div class="${cls}" data-id="${n.id}" tabindex="0" role="button"${bc ? ` aria-expanded="${open.has(n.id)}"` : ""}>`
    + `<span class="nt">${esc(n.t)}</span>`
    + (n.sub ? `<span class="ns">${esc(n.sub)}</span>` : "") + cnt + `</div>`;
}
const f1 = v => v.toFixed(1);
function render() {
  const vis = [];
  const walk = n => { vis.push(n); branchKids(n).forEach(walk); };
  SPINE.forEach(id => walk(byId.get(id)));
  world.innerHTML = `<svg id="edges" aria-hidden="true"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,1 L10,5 L0,9 z"/></marker></defs></svg>`
    + vis.map(nodeHTML).join("")
    + SPINE.slice(1).map(id => `<div class="bridge" data-for="${id}">${esc(BRIDGE[id])}</div>`).join("")
    + `<div class="bridge back" id="backlbl">${esc(LOOPBACK)}</div>`;
  vis.forEach(n => { const el = world.querySelector(`.node[data-id="${n.id}"]`); n._el = el; n._w = el.offsetWidth; n._h = el.offsetHeight; });
  const bl = {};
  world.querySelectorAll(".bridge[data-for]").forEach(el => { bl[el.dataset.for] = { el, w: el.offsetWidth, h: el.offsetHeight, x: 0, y: 0 }; });
  const back = world.querySelector("#backlbl"), bw = back.offsetWidth, bh = back.offsetHeight;
  const sh = n => { const ch = branchKids(n); if (!ch.length) return (n._sh = n._h); let t = 0; ch.forEach((c, i) => { t += sh(c) + (i ? VG : 0); }); return (n._sh = Math.max(n._h, t)); };
  const place = (n, x, y) => {
    n._x = x; n._y = y + (n._sh - n._h) / 2;
    const ch = branchKids(n); if (!ch.length) return;
    const tot = ch.reduce((acc, c, i) => acc + c._sh + (i ? VG : 0), 0);
    let yy = y + (n._sh - tot) / 2; const cx = x + n._w + HG;
    ch.forEach(c => { place(c, cx, yy); yy += c._sh + VG; });
  };
  const cx = LP + Math.max(...SPINE.map(id => byId.get(id)._w)) / 2;
  let y = 0;
  SPINE.forEach((id, i) => {
    const S = byId.get(id), br = branchKids(S);
    br.forEach(sh);
    const Bh = br.reduce((acc, c, k) => acc + c._sh + (k ? VG : 0), 0), band = Math.max(S._h, Bh);
    S._x = cx - S._w / 2; S._y = y + (band - S._h) / 2;
    let yy = y + (band - Bh) / 2; const bx = S._x + S._w + HG;
    br.forEach(c => { place(c, bx, yy); yy += c._sh + VG; });
    y += band;
    if (i < SPINE.length - 1) { const b = bl[SPINE[i + 1]], gap = Math.max(56, b.h + 30); b.x = cx + 14; b.y = y + (gap - b.h) / 2; y += gap; }
  });
  let W = 1, H = 1, d = "";
  vis.forEach(n => { n._el.style.left = n._x + "px"; n._el.style.top = n._y + "px"; W = Math.max(W, n._x + n._w); H = Math.max(H, n._y + n._h); });
  Object.values(bl).forEach(b => { b.el.style.left = b.x + "px"; b.el.style.top = b.y + "px"; W = Math.max(W, b.x + b.w); });
  vis.forEach(n => branchKids(n).forEach(c => {
    if (SPINE_SET.has(c.id)) return;
    const x1 = n._x + n._w, y1 = n._y + n._h / 2, x2 = c._x, y2 = c._y + c._h / 2, mx = (x1 + x2) / 2;
    d += `<path class="br" d="M${f1(x1)},${f1(y1)} C${f1(mx)},${f1(y1)} ${f1(mx)},${f1(y2)} ${f1(x2)},${f1(y2)}"/>`;
  }));
  for (let i = 0; i < SPINE.length - 1; i++) {
    const A = byId.get(SPINE[i]), B = byId.get(SPINE[i + 1]);
    d += `<path class="sp" marker-end="url(#ah)" d="M${f1(cx)},${f1(A._y + A._h)} L${f1(cx)},${f1(B._y - 1)}"/>`;
  }
  const L = byId.get("loop"), S1 = byId.get("s1");
  const x1 = L._x, y1 = L._y + L._h / 2, x2 = S1._x, y2 = S1._y + S1._h / 2, bend = Math.min(x1, x2) - 66;
  d += `<path class="lp" marker-end="url(#ah)" d="M${f1(x1)},${f1(y1)} C${f1(bend)},${f1(y1)} ${f1(bend)},${f1(y2)} ${f1(x2 - 1)},${f1(y2)}"/>`;
  const minX = 0.125 * (x1 + x2) + 0.75 * bend;
  back.style.left = Math.max(2, minX - bw - 6) + "px"; back.style.top = ((y1 + y2) / 2 - bh / 2) + "px";
  const svg = world.querySelector("#edges");
  svg.setAttribute("width", W); svg.setAttribute("height", H); svg.insertAdjacentHTML("beforeend", d);
  world.style.width = W + "px"; world.style.height = H + "px";
  bounds = { W, H };
}
const wide = () => window.matchMedia("(min-width: 860px)").matches;
function avail() {
  const r = map.getBoundingClientRect(); let w = r.width, h = r.height;
  if (!panel.hidden) { if (wide()) w -= panel.offsetWidth; else h -= panel.offsetHeight; }
  return { w: Math.max(w, 80), h: Math.max(h, 80) };
}
function apply() { world.style.transform = `translate(${tx}px, ${ty}px) scale(${sc})`; }
const clamp = v => Math.min(2.2, Math.max(0.12, v));
function fit() {
  const a = avail(), pad = 20, top = 52, bot = 46;
  sc = clamp(Math.min((a.w - pad * 2) / bounds.W, (a.h - top - bot) / bounds.H, 1.1));
  tx = Math.max(pad, (a.w - bounds.W * sc) / 2);
  ty = top + Math.max(0, (a.h - top - bot - bounds.H * sc) / 2);
  apply();
}
function fitTop() {
  const a = avail(), pad = 20, top = 52;
  sc = clamp(Math.min((a.w - pad * 2) / bounds.W, 0.9));
  tx = Math.max(pad, (a.w - bounds.W * sc) / 2); ty = top; apply();
}
function zoomAt(cx, cy, ns, base) {
  const r = map.getBoundingClientRect(), b = base || { tx, ty, sc };
  const px = cx - r.left, py = cy - r.top, wx = (px - b.tx) / b.sc, wy = (py - b.ty) / b.sc;
  sc = ns; tx = px - wx * sc; ty = py - wy * sc; apply();
}
function keepVisible(n) {
  const a = avail(), m = 12, w = n._w * sc, h = n._h * sc;
  let x = n._x * sc + tx, y = n._y * sc + ty;
  if (x + w > a.w - m) { tx -= x + w - (a.w - m); x = n._x * sc + tx; }
  if (x < m) tx += m - x;
  if (y + h > a.h - m) { ty -= y + h - (a.h - m); y = n._y * sc + ty; }
  if (y < m) ty += m - y;
}
function center(n) {
  const a = avail(); if (sc < 0.75) sc = 0.9;
  tx = a.w / 2 - (n._x + n._w / 2) * sc; ty = a.h / 2 - (n._y + n._h / 2) * sc; apply();
}
function showPanel(n) {
  pbody.innerHTML = `<div class="ptags"><span class="chip c-type">${TYPES[n.type] || ""}</span></div>`
    + `<h2>${esc(n.t)}</h2>${n.sub ? `<p class="psub">${esc(n.sub)}</p>` : ""}${contentHTML(n)}`;
  panel.hidden = false; panel.scrollTop = 0; document.body.classList.add("has-panel");
}
function hidePanel() {
  panel.hidden = true; document.body.classList.remove("has-panel"); selected = null;
  world.querySelectorAll(".node.sel").forEach(el => el.classList.remove("sel"));
}
function clickNode(id) {
  const n = byId.get(id); if (!n) return;
  const sx = n._x * sc + tx, sy = n._y * sc + ty;
  if (n.c && n.c.length) { if (open.has(id)) open.delete(id); else open.add(id); }
  selected = id; render(); tx = sx - n._x * sc; ty = sy - n._y * sc;
  showPanel(n); keepVisible(n); apply(); save(); hash(id);
}
function focusId(id) {
  const n = byId.get(id); if (!n) return;
  const path = []; for (let x = n; x; x = x.p) path.unshift(x);
  for (let i = 0; i < path.length - 1; i++) { if (path[i].id === "root" && SPINE_SET.has(path[i + 1].id)) continue; open.add(path[i].id); }
  if (n.type === "group" && n.c && n.c.length) open.add(id);
  selected = id; save(); hash(id);
  if (view === "map") { render(); showPanel(n); center(n); }
  else openListTo(n);
}

/* 指针：拖动平移、双指缩放、点击 */
let pts = new Map(), down = null, moved = false, pinch = null;
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
map.addEventListener("pointerdown", e => {
  if (e.pointerType === "mouse" && e.button !== 0) return;
  try { map.setPointerCapture(e.pointerId); } catch (err) {}
  pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pts.size === 1) { down = { x: e.clientX, y: e.clientY, tx, ty, node: e.target.closest(".node") }; moved = false; }
  else if (pts.size === 2) { const [a, b] = [...pts.values()]; pinch = { d: dist(a, b) || 1, sc, tx, ty, cx: (a.x + b.x) / 2, cy: (a.y + b.y) / 2 }; moved = true; }
});
map.addEventListener("pointermove", e => {
  if (!pts.has(e.pointerId)) return;
  pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pts.size >= 2 && pinch) { const [a, b] = [...pts.values()]; zoomAt(pinch.cx, pinch.cy, clamp(pinch.sc * dist(a, b) / pinch.d), pinch); return; }
  if (!down) return;
  const dx = e.clientX - down.x, dy = e.clientY - down.y, th = e.pointerType === "mouse" ? 4 : 10;
  if (!moved && Math.hypot(dx, dy) > th) { moved = true; map.classList.add("dragging"); }
  if (moved) { tx = down.tx + dx; ty = down.ty + dy; apply(); }
});
function endPtr(e, cancel) {
  if (!pts.has(e.pointerId)) return;
  pts.delete(e.pointerId); if (pts.size < 2) pinch = null;
  if (pts.size) return;
  map.classList.remove("dragging");
  if (!cancel && down && !moved) { if (down.node) clickNode(down.node.dataset.id); else hidePanel(); }
  down = null;
}
map.addEventListener("pointerup", e => endPtr(e, false));
map.addEventListener("pointercancel", e => endPtr(e, true));
map.addEventListener("wheel", e => {
  e.preventDefault();
  if (e.ctrlKey || e.metaKey) zoomAt(e.clientX, e.clientY, clamp(sc * Math.exp(-e.deltaY * 0.01)));
  else { tx -= e.deltaX; ty -= e.deltaY; apply(); }
}, { passive: false });
map.addEventListener("keydown", e => {
  const el = e.target.closest && e.target.closest(".node");
  if (el && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); clickNode(el.dataset.id); }
});
$("#ctl").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return; const r = map.getBoundingClientRect();
  const act = b.dataset.act;
  if (act === "fit") fit();
  if (act === "all") { byId.forEach(n => { if (n.c && n.c.length) open.add(n.id); }); render(); fitTop(); save(); }
  if (act === "none") { open = new Set(); hidePanel(); render(); fit(); save(); }
  if (act === "in" || act === "out") zoomAt(r.left + r.width / 2, r.top + r.height / 2, clamp(sc * (act === "in" ? 1.25 : 0.8)));
});
$("#pclose").addEventListener("click", hidePanel);
document.addEventListener("keydown", e => { if (e.key === "Escape") { hideResults(); if (!panel.hidden) hidePanel(); } });

/* 跳转：面板、列表、搜索结果、图例里的链接 */
document.addEventListener("click", e => {
  const g = e.target.closest("[data-go]"); if (!g) return;
  e.preventDefault(); hideResults(); $("#q").blur(); focusId(g.dataset.go);
});

/* ── 列表视图 ── */
function itemHTML(n) {
  return `<details class="li d${Math.min(n.depth, 2)}" id="li-${n.id}"${n.depth === 0 ? " open" : ""}>`
    + `<summary><span class="lt">${esc(n.t)}</span>`
    + (n.sub ? `<span class="ls">${esc(n.sub)}</span>` : "") + `</summary>`
    + `<div class="lbody">${contentHTML(n)}</div>`
    + (n.c && n.c.length ? `<div class="lkids">${n.c.map(itemHTML).join("")}</div>` : "") + `</details>`;
}
function buildList() {
  listEl.innerHTML = `<div class="lwrap"><div class="ltools"><button type="button" data-lact="open">全部展开</button><button type="button" data-lact="close">全部收起</button></div>${itemHTML(DATA)}</div>`;
  listBuilt = true;
}
listEl.addEventListener("click", e => {
  const b = e.target.closest("[data-lact]"); if (!b) return;
  listEl.querySelectorAll("details.li").forEach(d => { d.open = b.dataset.lact === "open" || d.id === "li-root"; });
});
function openListTo(n) {
  if (!listBuilt) buildList();
  for (let x = n; x; x = x.p) { const d = document.getElementById("li-" + x.id); if (d) d.open = true; }
  const el = document.getElementById("li-" + n.id);
  if (el) { el.scrollIntoView({ block: "start" }); el.classList.add("flash"); setTimeout(() => el.classList.remove("flash"), 1400); }
}
function setView(v) {
  view = v; save();
  $("#v-map").setAttribute("aria-pressed", v === "map"); $("#v-list").setAttribute("aria-pressed", v === "list");
  map.hidden = v !== "map"; $("#ctl").hidden = v !== "map"; $("#hint").hidden = v !== "map"; listEl.hidden = v !== "list";
  if (v === "list") { const s = selected; hidePanel(); if (!listBuilt) buildList(); if (s) openListTo(byId.get(s)); }
  else { render(); fit(); }
}
$("#v-map").addEventListener("click", () => setView("map"));
$("#v-list").addEventListener("click", () => setView("list"));

/* ── 搜索 ── */
const text = n => [n.t, n.sub, n.d, n.gt, (n.k || []).join("；"), n.e, n.mk, n.ai, n.x, n.done, n.test].filter(Boolean).join("；");
const results = $("#results"), q = $("#q");
let blurT = 0;
function hideResults() { clearTimeout(blurT); results.hidden = true; }
q.addEventListener("focus", () => clearTimeout(blurT));
q.addEventListener("input", () => {
  clearTimeout(blurT);
  const s = q.value.trim().toLowerCase(); if (!s) return hideResults();
  const hits = [];
  byId.forEach(n => {
    const t = n.t.toLowerCase(), body = text(n), bl = body.toLowerCase(), i = bl.indexOf(s);
    if (t.includes(s)) hits.push({ n, r: 0, snip: n.d || n.done || "" });
    else if (i >= 0) hits.push({ n, r: 1, snip: (i > 18 ? "…" : "") + body.slice(Math.max(0, i - 18), i + s.length + 40) + "…" });
  });
  hits.sort((a, b) => a.r - b.r);
  results.innerHTML = hits.length
    ? hits.slice(0, 14).map(h => `<button type="button" data-go="${h.n.id}"><b>${esc(h.n.t)}</b><span>${esc(h.snip.slice(0, 80))}</span></button>`).join("")
    : `<div class="none">没有找到「${esc(q.value)}」。试试更短的词。</div>`;
  results.hidden = false;
});
q.addEventListener("keydown", e => { if (e.key === "Enter") { const f = results.querySelector("[data-go]"); if (f) f.click(); } });
q.addEventListener("blur", () => { blurT = setTimeout(hideResults, 180); });

/* ── 启动 ── */
window.addEventListener("resize", () => { if (view === "map" && !panel.hidden && selected) { keepVisible(byId.get(selected)); apply(); } });
window.addEventListener("hashchange", () => { const h = location.hash.slice(1); if (byId.has(h) && h !== selected) focusId(h); });
const start = location.hash.slice(1);
if (view === "list") setView("list"); else { render(); fit(); }
if (start && byId.has(start)) focusId(start);
})();
</script>

</body>
</html>
